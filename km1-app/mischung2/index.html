/* ============================================================
   Werkzeug
   ============================================================ */
function h(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(id){return VIDEOS.filter(function(v){return v.id===id;})[0];}
function lvOf(n){return LEVELS[n-1];}
function drin(){return !!state.konto;}
function sek(d){var t=String(d).split(':');return (+t[0])*60 + (+t[1]||0);}
function fmtZeit(s){var g=Math.floor(s), m=Math.floor(g/60), r=g%60;return m+':'+(r<10?'0':'')+r;}
var TEMPI = [0.25, 0.5, 0.75, 1, 1.5];
function tempoText(t){ return String(t).replace('.', ',') + '\u00d7'; }
function tempoLabel(){ return tempoText(state.tempo); }
function lvFortschritt(nr){
  var u = PFAD[nr];
  return {fertig: u.filter(function(x){return state.done[x.id];}).length, gesamt: u.length};
}
/* Drei Stufen: offen fuer jeden, mit kostenlosem Konto, und die
   Profi-Einheiten im Abo. Was gesperrt ist, entscheidet die Stufe. */
function gesperrt(v){
  /* Was der Trainer als Hausaufgabe zuweist, sieht das ganze Team,
     auch eine Profi-Einheit. Das zahlt KM1 Team, nicht jedes Kind. */
  if(v.zg==='pro') return !state.pro && !vomTrainer(v.id);
  if(v.zg==='konto') return !drin();
  return false;
}
function zugangName(zg){
  return zg==='pro' ? 'Profi-Einheit' : (zg==='konto' ? 'Mit Konto' : 'Ohne Anmeldung');
}

/* Kapitelmarken. Bis die Videos geschnitten sind, verteilen wir die
   Schritte gleichmaessig ueber die Laufzeit; beim Hochladen traegt Kader
   die echte Sekunde ein, das Feld dafuer steht im Datenmodell. */
function kapitelSek(v, i){
  if(v.sk && v.sk[i] != null) return v.sk[i];
  var d = sek(v.d), n = (v.st || []).length || 1;
  var los = Math.round(d * 0.06);
  return Math.round(los + (d - los) * (i / n));
}

/* Wer seinen Pfad geschafft hat, steigt auf. Es zaehlt derselbe Pfad,
   den die Pyramide als 5 / 5 zeigt. Vorher zaehlten alle Videos der
   Ebene, und wer Pro hatte, hing an der Profi-Einheit fest, obwohl die
   Pyramide laengst voll war. Gesperrte Videos zaehlen nie mit. */
function pruefeAufstieg(){
  if(!drin() || state.meinLv >= LEVELS.length) return false;
  var meine = PFAD[state.meinLv].map(function(u){ return byId(u.id); })
    .filter(function(v){ return v && !gesperrt(v); });
  if(!meine.length) return false;
  var fertig = meine.every(function(v){ return !!state.done[v.id]; });
  if(!fertig) return false;
  state.meinLv += 1;
  return true;
}
/* Was noch zu tun ist: offen fuer mich und nicht abgehakt. Vorher
   zaehlte hier alles Freigeschaltete, auch das schon Erledigte. */
function offenFuerMich(){return VIDEOS.filter(function(v){return !gesperrt(v) && !state.done[v.id];}).length;}

/* Abgehakte Uebungen. Die Challenge zaehlt nicht dazu: sie ist ein
   Wettbewerb, keine Einheit aus dem Pfad. */
function uebungen(){
  return Object.keys(state.done).filter(function(k){ return k.indexOf('challenge-') !== 0 && byId(k); });
}
/* state.done merkt sich, wann abgehakt wurde. Die Woche beginnt am
   Montag um null Uhr. */
var TAG_MS = 864e5;
function wochenStart(t){
  var d = new Date(t === undefined ? Date.now() : t);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d.getTime();
}
function dieseWoche(){
  var ab = wochenStart();
  return uebungen().filter(function(k){ return state.done[k] >= ab; }).length;
}
/* Die Serie in Wochen: wie viele Wochen am Stueck mindestens eine Uebung
   hatten. Die laufende Woche bricht sie nicht, solange sie noch laeuft. */
function serieWochen(){
  var wochen = {};
  uebungen().forEach(function(k){ wochen[wochenStart(state.done[k])] = 1; });
  var ab = wochenStart(), n = 0;
  if(!wochen[ab]) ab = wochenStart(ab - TAG_MS);
  while(wochen[ab]){ n++; ab = wochenStart(ab - TAG_MS); }
  return n;
}
/* Das naechste Video auf dem eigenen Pfad, das noch nicht abgehakt ist. */
function naechstesVideo(){
  var ebene = drin() ? state.meinLv : 1;
  var offen = VIDEOS.filter(function(x){ return !gesperrt(x) && !state.done[x.id] && x.lv === ebene; });
  if(!offen.length) offen = VIDEOS.filter(function(x){ return !gesperrt(x) && !state.done[x.id]; });
  return offen[0] || null;
}

/* Waehlt die Schriftstufe fuer den Titel der grossen Karte: ein sehr
   langes Wort oder ein sehr langer Titel bekommt die kleinste Stufe. */
function titelKlasse(titel){
  var lang = titel.split(/\s+/).some(function(w){ return w.length > 15; });
  if(lang || titel.length > 34) return ' eng';
  if(titel.length > 24) return ' mittel';
  return '';
}

      '<span class="m"><i class="dot" style="background:'+lvOf(v.lv).c+'"></i>'+KAT[v.k]+' · Ebene '+v.lv+'</span>' +

/* Die Karte oben auf der Startseite: das angefangene Video, sonst das
   naechste offene der eigenen Ebene. */
function startKarte(){
  var id = state.zuletzt, stelle = id && state.gesehen[id], v = id && byId(id);
  if(v && stelle && !gesperrt(v)){
    var d = sek(v.d);
    return heroKarte(v, 'Weitertrainieren',
      fmtZeit(d - stelle)+' übrig · '+lvOf(v.lv).nm,
      Math.max(3, Math.round(stelle / d * 100)));
  }
  /* Wer Spieler betreut oder sichtet, sieht oben die neueste
     Profi-Einheit: mit KM1 Team ist sie fuer die ganze Mannschaft frei. */
  if(istPruefRolle()){
    var pe = VIDEOS.filter(function(x){ return x.zg === 'pro' && x.neu; })[0];
    return heroKarte(pe, 'Neue Profi-Einheit',
      state.rolle === 'trainer' ? 'Als Hausaufgabe für dein ganzes Team frei' : pe.d+' · '+(pe.gast || 'Profi-Einheit'), 0);
  }
  var n = naechstesVideo() || VIDEOS[0];
  return heroKarte(n, drin() ? (state.rolle === 'eltern' ? KIND.vn+' als Nächstes' : 'Als Nächstes') : 'Fang hier an', n.d+' · '+lvOf(n.lv).nm, 0);
}

/* Die Zeile ueber der Begruessung. Sie kennt den Wochentag und die Tage,
   die in der Erinnerung stehen. Vorher stand dort jeden Tag „Mittwoch". */
function heuteZeile(){
  var heute = new Date().getDay();
  var tag = WOCHENTAGE[heute];
  var e = state.erinnerung;
  if(!e.an || !e.tage.length) return tag;
  var nr = function(k){ return (TAGE.map(function(t){ return t[0]; }).indexOf(k) + 1) % 7; };
  var plan = e.tage.map(nr);
  if(plan.indexOf(heute) >= 0) return tag+', Trainingstag';
  for(var i = 1; i < 7; i++){
    var d = (heute + i) % 7;
    if(plan.indexOf(d) >= 0) return tag+(i === 1 ? ', morgen Training' : ', Training am '+WOCHENTAGE[d]);
  }
  return tag;
}

/* Ein Ring wie in Fitness. q ist der Anteil zwischen 0 und 1. Bei null
   bleibt nur die Spur stehen: ein Ring aus einem einzigen runden Ende
   saehe aus wie ein Fleck. */
function ring(q){
  var p = Math.round(Math.max(0, Math.min(1, q)) * 100);
  return '<svg class="ring" viewBox="0 0 64 64" aria-hidden="true">' +
    '<circle class="spur" cx="32" cy="32" r="26"/>' +
    (p > 0 ? '<circle class="voll" cx="32" cy="32" r="26" pathLength="100" stroke-dasharray="'+p+' 100" transform="rotate(-90 32 32)"/>' : '') +
  '</svg>';
}

function pyramide(){
  var geo = [
    {n:4, y0:0.78,  y1:17.94, x0a:33.67, x1a:66.33, x0b:26.41, x1b:73.59},
    {n:3, y0:19.89, y1:37.05, x0a:25.58, x1a:74.42, x0b:18.32, x1b:81.68},
    {n:2, y0:39.00, y1:56.16, x0a:17.50, x1a:82.50, x0b:10.24, x1b:89.76},
    {n:1, y0:58.11, y1:75.27, x0a:9.41,  x1a:90.59, x0b:2.16,  x1b:97.84}
  ];
  /* Jede Ebene fuellt sich von unten, so weit ihr Pfad abgehakt ist.
     Die eigene Ebene steht in voller Linie, die naechste gestrichelt:
     angedeutet, aber noch nicht deins. */
  var defs = '', plates = '';
  geo.forEach(function(g){
    var l = lvOf(g.n);
    var an = state.lvSel===g.n, mein = drin() && state.meinLv===g.n, naechste = drin() && (state.meinLv+1)===g.n;
    var pts = g.x0a+','+g.y0+' '+g.x1a+','+g.y0+' '+g.x1b+','+g.y1+' '+g.x0b+','+g.y1;
    var my = g.y0 + (g.y1-g.y0)/2;
    var f = lvFortschritt(g.n), q = drin() ? f.fertig/f.gesamt : 0;
    var hoehe = (g.y1-g.y0)*q;
    var yNm = drin() ? my-1.4 : my+0.2;
    var yAg = drin() ? my+2.9 : my+4.6;
    defs += '<clipPath id="cp'+g.n+'"><polygon points="'+pts+'"/></clipPath>';
    plates += '<g class="plate" data-act="lv:'+g.n+'" role="button" tabindex="0" aria-label="'+l.nm+', '+l.ag+
        (drin() ? ', '+f.fertig+' von '+f.gesamt+' Einheiten' : '')+'">' +
      '<polygon points="'+pts+'" fill="'+l.c+'" fill-opacity="'+(an?.16:.07)+'"/>' +
      (q>0 ? '<g clip-path="url(#cp'+g.n+')"><rect x="0" y="'+(g.y1-hoehe).toFixed(2)+
             '" width="100" height="'+hoehe.toFixed(2)+'" fill="'+l.c+'" fill-opacity=".42"/></g>' : '') +
      '<polygon points="'+pts+'" fill="none" stroke="'+l.c+
        '" stroke-opacity="'+(mein?1:(an?.85:(naechste?.5:.3)))+
        '" stroke-width="'+((mein||an)?.75:.4)+'"'+((naechste&&!an)?' stroke-dasharray="2.2 1.8"':'')+'/>' +
      '<text class="nm" x="50" y="'+yNm+'">'+l.nm+'</text>' +
      '<text class="ag" x="50" y="'+yAg+'">'+l.ag+'</text>' +
      (drin() ? '<text class="fz" x="50" y="'+(my+6.6)+'">'+f.fertig+' / '+f.gesamt+'</text>' : '') +
    '</g>';
  });

  return '<svg class="pyr" viewBox="0 0 100 78" role="img" aria-label="Die KM1-Pyramide mit vier Ebenen">' +
    '<defs>'+defs+'</defs>' +
    '<path class="edge" d="M33.3 0.4L1.8 76.2M66.7 0.4L98.2 76.2M1.8 76.2h96.4"/>' + plates + '</svg>';
}

   Telefone zum Antippen und darunter der Schalter „Automatisch". Wer
   ein Telefon waehlt, schaltet „Automatisch" damit aus — genau wie in
   iOS. Wer „Automatisch" ausschaltet, behaelt, was gerade zu sehen ist. */
function darstellung(){
  var auto = state.theme === 'auto';
  var jetzt = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dunkel' : 'hell';
  var aktiv = auto ? jetzt : state.theme;
  var wahl = function(t, nm){
    return '<button class="dwahl" type="button" data-act="theme:'+t+'" aria-pressed="'+(aktiv===t)+'">' +
      '<span class="dvorschau '+t+'" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' +
      '<span>'+nm+'</span><span class="dkreis" aria-hidden="true"></span></button>';
  };
  return '<div class="block">' +
    '<h2 class="sec leise">Darstellung</h2>' +
    '<div class="rows">' +
      '<div class="dwahlen">'+wahl('hell','Hell')+wahl('dunkel','Dunkel')+'</div>' +
      '<button class="lrow" type="button" role="switch" aria-checked="'+auto+'" data-act="theme:'+(auto ? aktiv : 'auto')+'">' +
        '<span>Automatisch</span><span class="schalter" aria-hidden="true"></span></button>' +
    '</div>' +
  '</div>';
}

  var teile = String(name || '').replace(/[^\p{L}\s-]/gu, '').trim().split(/[\s-]+/);

/* ============================================================
   Schiebeblaetter
   ============================================================ */
var stack = [];

var app = document.querySelector('.app');
function openSheet(html){
  stack.push(html);
  var s = document.getElementById('sheet');
  clearTimeout(s._weg);
  s.innerHTML = html; s.hidden = false; s.scrollTop = 0;
  s.classList.remove('on');
  /* Die Ausgangslage einmal berechnen lassen, sonst springt das Blatt
     ohne Bewegung an seinen Platz. */
  void s.offsetWidth;
  requestAnimationFrame(function(){ s.classList.add('on'); app.classList.add('blatt'); });
}
function closeSheet(){
  if(P.kino) kinoZu();
  stopPlayer();
  stack.pop();
  var s = document.getElementById('sheet');
  if(!stack.length){
    /* Erst hinausschieben, dann leeren — wie der Schritt zurueck in iOS. */
    s.classList.remove('on');
    app.classList.remove('blatt');
    render();          /* damit die Karte oben die neue Stelle zeigt */
    clearTimeout(s._weg);
    s._weg = setTimeout(function(){
      if(stack.length) return;
      s.hidden = true; s.innerHTML = '';
    }, 460);
    return;
  }
  s.innerHTML = stack[stack.length-1];
  s.scrollTop = 0;
}
function refreshSheet(html){
  stack[stack.length-1] = html;
  var s = document.getElementById('sheet');
  var y = s.scrollTop;
  s.innerHTML = html;
  s.scrollTop = y;
}

/* ============================================================
   Haptik.
   Ein Impuls bestaetigt, was passiert ist — er schmueckt nicht.
   Was oefter als ein paarmal pro Minute vorkommt, schweigt: Tabs,
   Blaetter, Filter, Play. Und nie zwei Impulse fuer eine Handlung.

   Im Web laeuft das nur auf Android: navigator.vibrate hat WebKit nie
   eingebaut, und damit kennt es kein Browser auf dem iPhone. Unten
   steht ein Versuch ueber einen versteckten Schalter — der greift auf
   iOS 17.4 bis 26.4 und gibt auch dort nur einen einzelnen Tick her.
   Seit iOS 26.5 klopft nur noch ein echter Fingertipp auf den Schalter
   selbst, nicht mehr ein click() aus dem Skript.

   Verloren ist der Entwurf deshalb nicht, im Gegenteil: die echte App
   nimmt expo-haptics und spricht die Taptic Engine direkt an, und die
   ist praeziser als jeder Vibrationsmotor in einem Android-Geraet.
   Welches Muster auf welchen Aufruf geht, steht in KONZEPT.md.
   ============================================================ */
var MUSTER = {
  tick:     [7],                  /* rasten, wie ein Schieberegler */
  leicht:   [14],                 /* verstanden */
  mittel:   [24],                 /* Zustand gewechselt */
  wand:     [30],                 /* hier geht es nicht weiter */
  erfolg:   [16, 45, 26],         /* geschafft */
  serie:    [14, 40, 14, 40, 28], /* erster Haken des Tages */
  aufstieg: [14, 55, 14, 55, 40], /* leicht, leicht, kraeftig */
  fehler:   [22, 70, 22]          /* so nicht */
};
var letzterImpuls = 0;
function haptik(name){
  var m = MUSTER[name];
  if(!m) return;
  var jetzt = Date.now();
  if(jetzt - letzterImpuls < 60) return;   /* zwei Impulse stapeln sich nicht */
  letzterImpuls = jetzt;
  try{
    if(navigator.vibrate){ navigator.vibrate(m); return; }
  }catch(e){}
  iosImpuls();
}
/* Safari 17.4 bis 26.4 laesst den Schalter im Formular klopfen, wenn
   der Klick ueber sein Label laeuft. Ab 26.5 hat Apple das zugemacht.
   Der Aufruf bleibt trotzdem stehen: er kostet nichts, schadet nichts
   und hilft auf aelteren Geraeten. Gibt es ihn nicht, bleibt es still —
   ohne Ersatzanzeige, denn ein Impuls, den man sieht, ist keiner. */
var iosSchalter;
function iosImpuls(){
  if(iosSchalter === false) return;
  if(!iosSchalter){
    var feld = document.createElement('input');
    feld.type = 'checkbox';
    if(!('switch' in feld)){ iosSchalter = false; return; }
    feld.setAttribute('switch', '');
    var huelle = document.createElement('label');
    huelle.setAttribute('aria-hidden', 'true');
    huelle.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
    huelle.appendChild(feld);
    document.body.appendChild(huelle);
    iosSchalter = huelle;
  }
  try{ iosSchalter.click(); }catch(e){}
}

/* ============================================================
   Der Player.
   Noch ohne echte Datei: die Leiste laeuft, das Standbild bleibt
   stehen. Bedient wird er wie gewohnt — Doppeltipp links und rechts
   springt fuenf Sekunden, die Leiste laesst sich ziehen, und das
   Tempo sitzt im Vollbild, wo es niemandem im Weg steht.
   ============================================================ */
var P = {id:null, titel:'', poster:'', dauer:0, sek:0, laeuft:false, takt:null,
         kino:false, zieht:null, tippZeit:0, tippSeite:'', ruhe:null};

function stopPlayer(){
  merkeStelle();
  if(P.takt){ clearInterval(P.takt); P.takt = null; }
  P.laeuft = false;
}

/* Wo jemand stehen geblieben ist. Ganz am Anfang und fast am Ende
   zaehlt nicht — sonst steht auf der Startseite ein Video, das man
   schon gesehen hat. */
function merkeStelle(){
  /* Nur die Uebungsvideos. Die Challenge und die Videos aus dem Team
     gehoeren nicht auf die Karte „Weitertrainieren". */
  if(!P.id || !byId(P.id) || !P.dauer) return;
  if(P.sek < 5 || P.sek / P.dauer > 0.95){ delete state.gesehen[P.id]; return; }
  state.gesehen[P.id] = P.sek;
  state.zuletzt = P.id;
}

/* Die beiden Haelften zum Doppeltippen, dazu die Anzeige, die
   kurz aufblitzt, damit man den Sprung auch sieht. */
function zonen(){
  return '<div class="zone links" data-zone="links"></div>' +
    '<div class="zone rechts" data-zone="rechts"></div>' +
    '<span class="sprung links" data-sprung="links">'+ICON.rew+'5 s</span>' +
    '<span class="sprung rechts" data-sprung="rechts">'+ICON.rew+'5 s</span>';
}

function steuerung(gross){
  var pr = P.dauer ? (P.sek / P.dauer * 100) : 0;
  return '<div class="pctl'+(gross ? ' gross' : '')+'">' +
    '<button class="mini" type="button" data-act="play" aria-label="Abspielen oder anhalten">' +
      (P.laeuft ? ICON.pause : ICON.play) + '</button>' +
    '<span class="tm zeit">'+fmtZeit(P.sek)+'</span>' +
    '<span class="scrub" data-scrub><span class="spur">' +
      '<i style="width:'+pr+'%"></i><b class="griff" style="left:'+pr+'%"></b></span></span>' +
    '<span class="tm">'+fmtZeit(P.dauer)+'</span>' +
    (gross
      ? '<button class="mini tempo" type="button" data-act="tempo">'+tempoLabel()+'</button>' +
        '<button class="mini" type="button" data-act="kinozu" aria-label="Vollbild beenden">'+ICON.klein+'</button>'
      : '<button class="mini" type="button" data-act="kino" aria-label="Vollbild">'+ICON.voll+'</button>') +
  '</div>';
}

/* o = {id, titel, poster, dauer}. Ein anderes Video faengt vorne an,
   dasselbe behaelt seine Stelle, auch wenn das Blatt neu gebaut wird. */
function playerInline(o){
  /* Ein anderes Video steigt da ein, wo man aufgehoert hat. */
  if(P.id !== o.id){ stopPlayer(); P.id = o.id; P.sek = state.gesehen[o.id] || 0; }
  P.titel = o.titel; P.poster = o.poster; P.dauer = o.dauer;
  return '<div class="player" id="player">' +
    '<div class="poster">'+o.poster+'</div>' +
    zonen() +
    '<button class="pbtn" type="button" data-act="play" aria-label="Abspielen"'+(P.laeuft ? ' hidden' : '')+'>' +
      '<span>'+ICON.play+'</span></button>' +
    steuerung(false) +
  '</div>';
}

/* Alle sichtbaren Leisten nachfuehren, drinnen wie im Vollbild. */
function zeichnePlayer(){
  var pr = P.dauer ? (P.sek / P.dauer * 100) : 0, zt = fmtZeit(P.sek);
  [].forEach.call(document.querySelectorAll('.pctl'), function(c){
    var i = c.querySelector('.spur i');   if(i) i.style.width = pr+'%';
    var g = c.querySelector('.griff');    if(g) g.style.left  = pr+'%';
    var z = c.querySelector('.zeit');     if(z) z.textContent = zt;
    var m = c.querySelector('.mini');     if(m) m.innerHTML   = P.laeuft ? ICON.pause : ICON.play;
    var t = c.querySelector('.tempo');    if(t) t.textContent = tempoLabel();
  });
  var kap = document.querySelectorAll('[data-act^="kapitel:"]');
  if(kap.length){
    var jetzt = -1;
    for(var i = 0; i < kap.length; i++){
      if(P.sek + 0.5 >= parseFloat(kap[i].getAttribute('data-act').split(':')[1])) jetzt = i;
    }
    for(var j = 0; j < kap.length; j++) kap[j].parentNode.classList.toggle('jetzt', j === jetzt);
  }
  var pb = document.querySelector('#player .pbtn[data-act="play"]');
  if(pb) pb.hidden = P.laeuft;
  var kp = document.querySelector('.kino-play');
  if(kp){
    kp.hidden = P.laeuft;
    var sp = kp.querySelector('span'); if(sp) sp.innerHTML = ICON.play;
  }
}

function spiele(an){
  if(!P.id) return;
  var neu = (an === undefined) ? !P.laeuft : an;
  if(P.takt){ clearInterval(P.takt); P.takt = null; }
  if(neu && P.sek >= P.dauer) P.sek = 0;
  P.laeuft = neu;
  if(neu){
    P.takt = setInterval(function(){
      P.sek = Math.min(P.dauer, P.sek + 0.25 * state.tempo);
      merkeStelle();
      if(P.sek >= P.dauer){ stopPlayer(); }
      zeichnePlayer();
    }, 250);
    if(P.kino) ruhePlanen();
  } else if(P.kino){ steuerungZeigen(); }
  zeichnePlayer();
}

function springe(sek){
  if(!P.id) return;
  var vorher = P.sek;
  P.sek = Math.max(0, Math.min(P.dauer, P.sek + sek));
  /* Steht die Zeit schon am Rand, spuert man die Wand statt des Sprungs. */
  haptik(P.sek === vorher ? 'wand' : 'leicht');
  zeigeSprung(sek < 0 ? 'links' : 'rechts');
  zeichnePlayer();
}
function zeigeSprung(seite){
  var feld = document.getElementById('kino') || document.getElementById('player');
  if(!feld) return;
  var el = feld.querySelector('[data-sprung="'+seite+'"]');
  if(!el) return;
  el.classList.add('an');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('an'); }, 520);
}

/* Ein Tipp macht Pause, zwei springen. Deshalb wartet der erste Tipp
   kurz ab, ob ein zweiter kommt. */
function zonenTipp(seite){
  var jetzt = Date.now();
  if(P.tippSeite === seite && jetzt - P.tippZeit < 340){
    P.tippZeit = 0;
    springe(seite === 'links' ? -5 : 5);
    return;
  }
  P.tippZeit = jetzt; P.tippSeite = seite;
  setTimeout(function(){
    if(P.tippZeit !== jetzt) return;
    P.tippZeit = 0;
    if(P.kino && P.laeuft && !document.getElementById('kino').classList.contains('ruhe')) ruheSofort();
    else if(P.kino) steuerungZeigen();
    else spiele();
  }, 340);
}

/* Die Leiste ziehen. Waehrend des Ziehens laeuft die Zeit weiter,
   aber der Griff gehoert dem Finger. */
function scrubZu(e, sc){
  var spur = sc.querySelector('.spur'), r = spur.getBoundingClientRect();
  /* Im gedrehten Vollbild laeuft die Leiste von oben nach unten. */
  var quer = !!(sc.closest && sc.closest('.dreh.quer'));
  var roh = quer ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  var pr = Math.max(0, Math.min(1, roh));
  /* Am Anfang und am Ende einmal anstossen, nicht dauernd. */
  if(pr === 0 || pr === 1){ if(P.rand !== pr){ P.rand = pr; haptik('wand'); } }
  else P.rand = null;
  P.sek = pr * P.dauer;
  zeichnePlayer();
}

function kinoAuf(){

  requestAnimationFrame(function(){ el.classList.add('an'); });
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
  steuerungZeigen();
}
/* Am Schreibtisch heisst Vollbild wirklich Vollbild: das Fenster gibt
   seine Leisten ab. Auf dem Handy gibt es das nicht — dort bleibt es
   die gedrehte Flaeche aus drehAnpassen. */
function amSchreibtisch(){
  /* Dieselbe Schwelle wie im Stil. Absichtlich ohne pointer:fine:
     ein Tablet im Querformat soll die grosse Fassung bekommen. */
  return window.matchMedia('(min-width:1000px)').matches;
}
function echtesVollbild(){
  return amSchreibtisch() && !!document.fullscreenEnabled;
}
document.addEventListener('fullscreenchange', function(){
  /* Wer mit Escape aus dem Vollbild geht, will auch aus dem Kino. */
  if(!document.fullscreenElement && P.kino && amSchreibtisch()) kinoZu();
});

function drehAnpassen(){
  var el = document.getElementById('kino'), d = document.getElementById('dreh');
  if(!el || !d) return;
  var r = el.getBoundingClientRect();
  if(r.height > r.width){
    d.classList.add('quer');
    d.style.width = r.height+'px'; d.style.height = r.width+'px';
  } else {
    d.classList.remove('quer');
    d.style.width = ''; d.style.height = '';
  }
}
function kinoZu(){
  if(P.kino) haptik('mittel');
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); }catch(e){}
  window.removeEventListener('resize', drehAnpassen);
  var el = document.getElementById('kino');
  if(el){ el.classList.remove('an'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 240); }
  P.kino = false;
  clearTimeout(P.ruhe);
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  zeichnePlayer();
}
/* Im Vollbild zieht sich die Bedienung zurueck, sobald das Video laeuft. */
function steuerungZeigen(){
  var el = document.getElementById('kino');
  if(!el) return;
  el.classList.remove('ruhe');
  ruhePlanen();
}
function ruhePlanen(){
  clearTimeout(P.ruhe);
  if(!P.laeuft) return;
  P.ruhe = setTimeout(ruheSofort, 2600);
}
function ruheSofort(){
  var el = document.getElementById('kino');

  if(li) li.hidden = true;
}

document.addEventListener('pointerdown', function(e){

  haptik('tick');

});
document.addEventListener('pointermove', function(e){

});

/* Tastatur am Schreibtisch: was man von einem Videoplayer erwartet.
   Leertaste und K halten an, die Pfeile springen fuenf Sekunden, F
   schaltet das Vollbild, Escape geht zurueck. */
document.addEventListener('keydown', function(e){
  var feld = e.target && e.target.tagName;
  if(feld === 'INPUT' || feld === 'TEXTAREA' || feld === 'SELECT') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;

  if(k === 'Escape'){
    if(document.getElementById('lupe')) portraitZu();
    else if(P.kino) kinoZu();
    else if(stack.length) closeSheet();
    return;
  }
  /* Nur wenn ein Player wirklich zu sehen ist. */
  if(!P.id || !(P.kino || document.getElementById('player'))) return;

  if(k === ' ' || k === 'k' || k === 'K'){ e.preventDefault(); spiele(); }
  else if(k === 'ArrowLeft' || k === 'j' || k === 'J'){ e.preventDefault(); springe(-5); }
  else if(k === 'ArrowRight' || k === 'l' || k === 'L'){ e.preventDefault(); springe(5); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); if(P.kino) kinoZu(); else kinoAuf(); }
});

function applyTheme(){
  var t = state.theme, dunkel;
  if(t === 'auto'){
    dunkel = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } else {
    dunkel = (t === 'dunkel');
  }
  document.documentElement.setAttribute('data-theme', dunkel ? 'dark' : 'light');
}
function renderTabs(){
  /* Der mittlere Bereich wechselt mit der Rolle: Team, Familie,
     Akademie, Talente oder, fuer KM1 selbst, Pruefen. */
  var t = [
    ['start','Start',ICON.tabStart],['technik','Technik',ICON.tabTech],
    teamTab(),
    ['pyramide','Pyramide',ICON.tabPyr],['profil','Profil',ICON.tabProf]
  ];
  document.getElementById('tabs').innerHTML = t.map(function(x){
    return '<button class="tab" type="button" data-act="tab:'+x[0]+'"'+(state.tab===x[0]?' aria-current="page"':'')+'>' +
      '<span class="ti">'+x[2]+'</span><span>'+x[1]+'</span></button>';
  }).join('');
}
var letzterTab = null;
function render(){
  var s = {start:screenStart, technik:screenTechnik, team:screenTeam, pyramide:screenPyramide, profil:screenProfil}[state.tab];
  var flaeche = document.getElementById('screens');
  /* Beim Neuzeichnen derselben Seite bleibt die Liste stehen, wo sie stand;
     ein Tabwechsel faengt oben an. */
  var tabWechsel = state.tab !== letzterTab;
  var y = tabWechsel ? 0 : flaeche.scrollTop;
  /* Auch die waagerechten Leisten bleiben stehen, wo sie standen. Sonst
     springt die gerade angetippte Schaltflaeche aus dem Bild, weil die
     Leiste beim Neuzeichnen wieder von vorne anfaengt. */
  var x = (!tabWechsel)
    ? [].map.call(flaeche.querySelectorAll('.chips,.row'), function(l){ return l.scrollLeft; })
    : [];
  flaeche.innerHTML = s();
  flaeche.scrollTop = y;
  [].forEach.call(flaeche.querySelectorAll('.chips,.row'), function(l, i){
    if(x[i]) l.scrollLeft = x[i];
  });
  letzterTab = state.tab;
  /* Der Titel in der Kopfzeile, der beim Scrollen einblendet. */
  var kt = document.getElementById('kopftitel');
  if(kt) kt.textContent = {start:'Start', technik:'Technik', team:teamTab()[1], pyramide:'Pyramide', profil:'Profil'}[state.tab] || '';
  var ab = document.querySelector('.appbar');
  if(ab && y === 0) ab.classList.remove('tief', 'scrolled');

  /* Punkt 12: die Farbe der eigenen Ebene als Leitfarbe. Ohne Konto
     bleibt es beim Blau. */
  document.documentElement.style.setProperty('--mein',
    drin() ? lvOf(state.meinLv).c : 'var(--akzent)');

  /* Punkt 10: nur beim Wechsel der Seite blenden die Bloecke auf. */
  if(tabWechsel){
    var sec = flaeche.querySelector('.screen');
    if(sec){
      sec.classList.add('frisch');
      [].forEach.call(sec.children, function(kind, i){
        kind.style.animationDelay = Math.min(i * 45, 200) + 'ms';
      });
    }
  }
  renderTabs();
  /* Oben rechts: die Ebene fuer Spieler, sonst die Rolle mit Haken.
     Dahinter liegt die Wahl der Sicht fuer die Vorfuehrung. */
  var chip = document.getElementById('lvchip');
  chip.innerHTML = chipInhalt() + '<span class="pfeil" aria-hidden="true"></span>';
  chip.setAttribute('aria-label', 'Sicht wechseln');
}
var toastT = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove('on'); }, 2300);
}
function anmelden(name){
  state.konto = {name: name || 'Luis M.', vn: (name || 'Luis M.').split(' ')[0], seit: Date.now()};
  /* Beispieldaten fuer den Entwurf: zwei Uebungen in der letzten Woche,
     zwei in dieser. So zeigen Wochenziel und Serie echte Werte. */
  if(!Object.keys(state.done).length){
    var jetzt = Date.now(), vorige = wochenStart() - 3 * TAG_MS;
    state.done = {'erste-beruehrung':vorige, 'flacher-pass':vorige + 3600e3,
                  'abstoppen':jetzt - 60e3, 'flanke-innen':jetzt - 30e3};

}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var a = b.getAttribute('data-act'), i = a.indexOf(':');
  var k = i<0 ? a : a.slice(0,i), v = i<0 ? '' : a.slice(i+1);

  if(k==='tab'){ state.tab = v; while(stack.length) closeSheet(); render(); }
  else if(k==='video'){ openSheet(sheetVideo(v)); }
  else if(k==='back'){ closeSheet(); }
  else if(k==='challenge'){ openSheet(sheetChallenge()); }
  else if(k==='paywall'){ haptik('wand'); openSheet(sheetPaywall()); }
  else if(k==='preis'){ state.preis = v; refreshSheet(sheetPaywall()); }
  else if(k==='login'){ state.loginModus = (v==='alt') ? 'alt' : 'neu'; openSheet(sheetLogin()); }
  else if(k==='kontologin'){
    haptik('wand');
    state.nachLogin = 'video:'+v; state.loginModus = 'neu';
    openSheet(sheetLogin('Dieses Video gehört zu den '+zaehl('konto')+', für die ein kostenloses Konto reicht.'));
  }
  else if(k==='lmodus'){ state.loginModus = v; refreshSheet(sheetLogin()); }
  else if(k==='signin'){
    var nm = (document.getElementById('lg-name')||{}).value;
    var mail = (document.getElementById('lg-mail')||{}).value || '';
    /* Die Trainerrolle haengt am Konto, nicht an einem Schalter. */
    var trainer = /kader|km1-training/i.test(mail);
    state.owner = trainer;
    /* Ein neues Konto bekommt die Rolle aus der Liste. Wer sich mit
       einem bestehenden anmeldet, ist im Entwurf Luis aus der U13. */
    var neuesKonto = state.loginModus === 'neu' && !trainer;
    var rl = trainer ? 'km1' : (neuesKonto ? state.wahlRolle : 'spieler');
    anmelden(trainer ? 'Kader' : (nm && nm.trim() ? nm.trim() : rollenName(rl)));
    rolleSetzen(rl, neuesKonto);
    closeSheet();
    var n = state.nachLogin; state.nachLogin = null;
    render();
    /* Anmelden und der aufgeschobene Haken sind ein Vorgang, nicht zwei:
       es gibt einen Impuls, und zwar den fuer das, was der Nutzer wollte. */
    if(n && n.indexOf('check:')===0){
      var cid = n.slice(6);
      state.done[cid] = Date.now();
      var aufL = pruefeAufstieg();
      haptik(aufL ? 'aufstieg' : (state.serieHeute ? 'erfolg' : 'serie'));
      state.serieHeute = 1;
      render();
      if(aufL){ openSheet(sheetAufstieg()); toast('Angemeldet. Abgehakt.'); return; }
      if(stack.length) refreshSheet(cid.indexOf('challenge-')===0 ? sheetChallenge() : sheetVideo(cid));
      toast('Angemeldet. Abgehakt.');
    }
    else if(n && n.indexOf('video:')===0){
      haptik('erfolg');
      var vid = n.slice(6);
      if(stack.length) refreshSheet(sheetVideo(vid)); else openSheet(sheetVideo(vid));
      toast('Angemeldet, Video ist offen');
    }
    else if(n === 'pro'){ haptik('erfolg'); openSheet(sheetPaywall()); toast('Angemeldet'); }
    else if(n === 'teamabo'){ haptik('erfolg'); openSheet(sheetTeamAbo()); toast('Angemeldet'); }
    else { haptik('erfolg'); toast('Angemeldet'); }
  }
  else if(k==='logout'){
    state.konto = null; state.pro = false; state.abo = null; state.owner = false; state.done = {};
    state.symbol = 'standard'; state.merk = {}; state.meinLv = 1;
    rolleZuruecksetzen();
    render(); toast('Abgemeldet');
  }
  else if(k==='buy'){
    if(!drin()){ haptik('wand'); state.nachLogin = 'pro'; state.loginModus='neu'; openSheet(sheetLogin('Für ein Abo braucht es ein Konto, sonst weiß niemand, wem PRO gehört.')); return; }
    state.pro = true;
    state.abo = {preis: state.preis, bis: Date.now() + 7 * TAG_MS};
    haptik('aufstieg');          /* Ein Kauf muss ankommen */
    while(stack.length) closeSheet();
    render(); toast('KM1 Pro ist aktiv');
  }
  else if(k==='check'){
    if(!drin()){
      haptik('wand');
      state.nachLogin = 'check:'+v; state.loginModus='neu';
      openSheet(sheetLogin('Damit dein Fortschritt gespeichert wird, brauchst du ein Konto.'));
      return;
    }
    var auf = false;
    if(state.done[v]){
      delete state.done[v];
      haptik('leicht');          /* Rueckgaengig ist keine Belohnung */
    } else {
      state.done[v] = Date.now();
      auf = pruefeAufstieg();
      /* Der groessere Impuls gewinnt: wer durch den Haken aufsteigt,
         spuert den Aufstieg, nicht den Haken. Der erste Haken des Tages
         traegt die Serie — hier im Entwurf der erste seit dem Start,
         spaeter der erste im Kalendertag. */
      haptik(auf ? 'aufstieg' : (state.serieHeute ? 'erfolg' : 'serie'));
      state.serieHeute = 1;
    }
    var istCh = v.indexOf('challenge-')===0;
    refreshSheet(istCh ? sheetChallenge() : sheetVideo(v));
    if(auf){ render(); openSheet(sheetAufstieg()); return; }
    toast(state.done[v] ? 'Abgehakt. Stark.' : 'Haken entfernt');
  }
  else if(k==='play'){ spiele(); }
  else if(k==='kapitel'){
    if(!P.id) return;
    P.sek = Math.max(0, Math.min(P.dauer, parseFloat(v)));
    haptik('leicht');
    zeichnePlayer();

  else if(k==='kino'){ kinoAuf(); }
  else if(k==='kinozu'){ kinoZu(); }
  else if(k==='tempo'){
    var li = document.getElementById('tempoliste');

  }
  else if(k==='tempowahl'){
    state.tempo = parseFloat(v);
    haptik('tick');              /* rastet wie ein Rad */
    var li2 = document.getElementById('tempoliste');
    if(li2){
      li2.hidden = true;
      [].forEach.call(li2.children, function(kn){
        if(parseFloat(kn.getAttribute('data-act').split(':')[1]) === state.tempo) kn.setAttribute('aria-pressed','true');
        else kn.removeAttribute('aria-pressed');
      });
    }
    if(P.laeuft) spiele(true); else zeichnePlayer();
    steuerungZeigen();
  }
  else if(k==='portrait'){ portraitAuf(); }
  else if(k==='eltern'){ openSheet(sheetEltern()); }
  else if(k==='symbol'){ openSheet(sheetSymbol()); }
  else if(k==='merkliste'){ openSheet(sheetMerk()); }
  else if(k==='merk'){
    if(!drin()){
      haptik('wand');
      state.nachLogin = 'video:'+v; state.loginModus = 'neu';
      openSheet(sheetLogin('Damit deine Merkliste erhalten bleibt, brauchst du ein Konto.'));

  }
  else if(k==='daten'){ openSheet(sheetDaten()); }
  /* Auf der Elternseite heisst es Sie, sonst du. */
  else if(k==='loeschen'){ toast(v==='sie' ? 'Wir schicken Ihnen eine E-Mail zur Bestätigung' : 'Wir schicken dir eine E-Mail zur Bestätigung'); }
  else if(k==='bedingungen'){ openSheet(sheetBedingungen()); }
  else if(k==='pwvergessen'){
    var pm = ((document.getElementById('lg-mail')||{}).value || '').trim();
    if(pm.indexOf('@') < 1){ haptik('fehler'); toast('Trag zuerst deine E-Mail-Adresse ein'); return; }
    haptik('leicht'); toast('Der Link zum Zurücksetzen ist unterwegs');
  }
  else if(k==='restore'){ toast('Keine früheren Käufe gefunden'); }
  else if(k==='sym'){
    if(v==='pro' && !state.pro){ haptik('wand'); openSheet(sheetPaywall()); return; }
    state.symbol = v;

    refreshSheet(sheetSymbol());
    toast(v==='pro' ? 'Symbol: Flutlicht' : 'Symbol: Standard');
  }
  else if(k==='erinnerung'){ openSheet(sheetErinnerung()); }
  else if(k==='eran'){ state.erinnerung.an = (v==='1'); haptik('leicht'); refreshSheet(sheetErinnerung()); }
  else if(k==='ertag'){

    state.erinnerung.tage.sort(function(x,y){

    var z = document.getElementById('er-zeit');
    if(z) state.erinnerung.zeit = z.value;
    if(state.erinnerung.an && !state.erinnerung.tage.length){ haptik('fehler'); toast('Wähl mindestens einen Tag'); return; }

    toast(state.erinnerung.an ? 'Erinnerung: '+erinnerungText() : 'Erinnerung aus');

  else if(k==='lv'){ state.lvSel = +v; render(); }
  else if(k==='kat'){ state.kat = v; render(); }

  var p = [];
  for(var i = 0; i < 16; i++){
    var r = i % 2 ? 9.3 : 11, w = i / 16 * Math.PI * 2 - Math.PI / 2;
    p.push((12 + r * Math.cos(w)).toFixed(2) + ',' + (12 + r * Math.sin(w)).toFixed(2));
  }
  return p.join(' ');
})();

  return '<svg viewBox="0 0 24 24" aria-hidden="true">' +

/* ---------- Nachschlagen ---------- */
function ichId(){
  if(!drin()) return null;
  if(state.rolle === 'eltern') return 'luis';
  if(state.rolle === 'spieler') return state.ichId || 'luis';
  return null;
}
function ichBin(id){ return !!id && ichId() === id; }
/* Eine Person aus dem Team. Luis und ein neu angelegter Spieler lesen
   ihren Fortschritt aus dem, was in der App abgehakt ist. */
function person(id){
  if(id === 'luis'){
    var fremd = state.ichId === 'neu';
    return {id:'luis', name:KIND.name, lv:fremd ? 1 : state.meinLv, jg:KIND.jg, ueb:fremd ? 7 : uebungen().length, wert:W.werte.luis};
  }
  if(id === 'neu') return {id:'neu', name:W.neuName || 'Ich', lv:state.meinLv, jg:state.jahrgang, ueb:uebungen().length, wert:W.werte.neu};
  if(id === 'tim') return {id:'tim', name:TEAM.trainer, lv:0, trainer:true};
  var s = SPIELER[id];
  if(!s) return null;
  return {id:id, name:s.name, lv:s.lv, jg:s.jg || 2014, ueb:s.ueb, wert:W.werte[id]};
}
function uploadVon(id){ return W.uploads.filter(function(u){ return u.id === id; })[0]; }
function beitragVon(id){ return W.feed.filter(function(b){ return b.id === id; })[0]; }
function anfrageVon(id){ return W.anfragen.filter(function(a){ return a.id === id; })[0]; }
function talentVon(id){ return talente().filter(function(t){ return t.id === id; })[0]; }
function teamIds(t){ return (t || TEAM).spieler; }

function meinTeam(){
  if(!drin()) return null;
  var r = state.rolle;
  if(r === 'trainer') return state.demo ? TEAM : state.eigenesTeam;
  if(r === 'spieler') return state.imTeam === true ? TEAM : null;
  if(r === 'eltern') return state.kindDa ? TEAM : null;
  return null;
}
function aufgabeFertig(a, id){
  if(id === 'luis' && state.ichId !== 'neu') return !!state.done[a.video];
  if(id === 'neu') return !!state.done[a.video];
  return a.fertig.indexOf(id) >= 0;
}
function aufgabeZahl(a, t){
  return teamIds(t).filter(function(id){ return aufgabeFertig(a, id); }).length;
}
function aufgabenQuote(t){
  var n = teamIds(t).length, a = t.aufgaben;
  if(!n || !a.length) return 0;
  var summe = 0;
  a.forEach(function(x){ summe += aufgabeZahl(x, t); });
  return Math.round(summe / (n * a.length) * 100);
}
/* Ist das Video eine Hausaufgabe fuer mich? Dann ist es frei, auch
   wenn es eine Profi-Einheit ist. */
function vomTrainer(id){
  /* Mit KM1 Team sieht der Trainer selbst alle Profi-Einheiten, damit
     er weiss, was er zuweist. */
  if(drin() && (state.rolle === 'trainer' || state.rolle === 'akademie') && state.teamAbo) return true;
  var t = meinTeam();
  if(!t || (state.rolle !== 'spieler' && state.rolle !== 'eltern')) return false;
  return t.aufgaben.some(function(a){ return a.video === id; });
}
function wartend(t){
  return W.uploads.filter(function(u){ return u.team === t.id && u.status === 'trainer'; });
}
function talente(){
  var l = TALENTE.slice();
  if(W.talent.sichtbar === 'frei'){
    l.unshift({id:'luis', name:KIND.name, jg:KIND.jg, pos:W.talent.pos, lang:W.talent.pos, fuss:W.talent.fuss,
      lv:person('luis').lv, ueb:person('luis').ueb, verein:TEAM.verein+' · '+TEAM.name, frei:'eltern', neu:true,
      werte:W.werte.luis ? [['Übersteiger in 60 Sekunden', String(W.werte.luis)]] : [],
      hl:[['flanken','Die Flanke mit der Innenseite']]});
  }
  if(W.talentNeu.sichtbar === 'frei' && W.neuName){
    var ich = person('neu');
    l.unshift({id:'neu', name:W.neuName, jg:state.jahrgang, pos:W.talentNeu.pos, lang:W.talentNeu.pos, fuss:W.talentNeu.fuss,
      lv:ich.lv, ueb:ich.ueb, verein:state.imTeam === true ? TEAM.verein+' · '+TEAM.name : 'Ohne Verein', frei:'16', neu:true,
      werte:W.werte.neu ? [['Übersteiger in 60 Sekunden', String(W.werte.neu)]] : [], hl:[['dribbling','Übersteiger in 60 Sekunden']]});
  }
  return l;
}

    return statsHtml([[uebungen().length, 'Übungen von '+KIND.vn], [z+'/'+a.length, 'Haus&shy;aufgaben'], [serieWochen(), 'Wochen&shy;serie']]);
  }

    var fb = t ? W.uploads.filter(function(u){ return u.team === t.id && u.status === 'feedback'; }).length : 0;
    return statsHtml([[t ? teamIds(t).length : 0, 'Spieler'], [t ? t.aufgaben.length : 0, 'Aufgaben'], [fb, 'Feedbacks']]);
  }
  if(r === 'akademie'){
    return state.demo ? statsHtml([[4, 'Teams'], [58, 'Spieler'], [4, 'Trainer']])
                      : statsHtml([[W.akNeu.length, 'Teams'], [0, 'Spieler'], [0, 'Trainer']]);

    var ma = W.anfragen.filter(function(a){ return a.scout === state.konto.name; }).length;

  return '';
}

  scout:    [['arbeit','Bestätigung des Vereins','für den du sichtest'],['fz','Erweitertes Führungszeugnis','nicht älter als drei Monate'],['ausweis','Ausweis','Vorder- und Rückseite']]
};
var PRUEF_TEXT = {
  trainer:'DFB B-Lizenz, erweitertes Führungszeugnis vom Juli, Bestätigung des SC Rheinblick.',
  akademie:'Vereinsregister, Kinderschutzkonzept und Ansprechperson mit Führungszeugnis.',

function pruefPanel(){
  if(!istPruefRolle()) return '';
  if(state.geprueft){
    return '<div class="panel">' +
      '<div class="pro-zeile"><span class="note" style="display:flex;align-items:center">Von KM1 geprüft'+haken()+'</span><span class="pille blau">Aktiv</span></div>' +
      '<p class="sub" style="margin:0">'+(state.demo ? PRUEF_TEXT[state.rolle] : 'Deine Belege sind geprüft.')+' Den Haken sehen alle, die mit dir zu tun haben.</p>' +
    '</div>';
  }
  if(state.pruefung === 'laeuft'){
    return '<div class="panel">' +
      '<div class="pro-zeile"><span class="note">Prüfung</span><span class="pille orange">Läuft</span></div>' +
      '<p class="sub" style="margin:0">KM1 prüft deine Belege von Hand, meist innerhalb von zwei Werktagen.</p>' +
      '<button class="demo" type="button" data-act="pruefok">Vorführung: Prüfung abschließen</button>' +
    '</div>';

  var was = {trainer:'Ohne Haken kann niemand deinem Team beitreten.', akademie:'Ohne Haken legt ihr keine Teams an.', scout:'Ohne Haken siehst du keine Talente.'}[state.rolle];
  return '<div class="callout"><span class="h">Noch nicht geprüft</span>' +

    '<button class="btn klein" type="button" data-act="pruefung" style="align-self:flex-start;margin-top:8px">Prüfung beantragen</button></div>';

/* ---------- Spieler ---------- */
function trainerZelle(t){
  return '<div class="coach">'+avatarVon(t.trainer, '#0D7C75') +
    '<span class="n">'+h(t.trainer)+haken()+'<span>Dein Trainer · DFB B-Lizenz</span></span></div>';
}
function aufgabenBlock(wer){
  var t = meinTeam();
  if(!t) return '';
  var a = t.aufgaben, id = ichId(), n = teamIds(t).length, tr = wer === 'trainer';
  var kopfz = '<div class="block-head"><h2 class="sec">Hausaufgaben</h2><span class="more">'+(tr ? n+' Spieler' : 'von '+h(vorname(t.trainer)))+'</span></div>';
  if(!a.length){
    return tr ? '<div class="block">'+kopfz+'<button class="btn" type="button" data-act="zuweisen">'+ICON.kalender+' Erste Aufgabe zuweisen</button></div>' : '';
  }
  var zeilen = a.map(function(x){
    var v = byId(x.video), fertig = !tr && aufgabeFertig(x, id), rechts;
    if(tr){
      var z = aufgabeZahl(x, t);
      rechts = '<span class="anteil"><b>'+z+'/'+n+'</b><span class="bar"><i style="width:'+(n ? z / n * 100 : 0)+'%"></i></span></span>';
    } else {
      rechts = '<span class="tick'+(fertig ? ' on' : '')+'">'+ICON.check+'</span>';
    }
    return '<button class="unit" type="button" data-act="'+(tr ? 'aufgabe:'+x.id : 'video:'+v.id)+'">' +
      '<span class="tag'+(x.eilig && !fertig ? ' eilig' : '')+'">'+x.bis+'</span>' +
      '<span><span class="t">'+h(v.t)+'</span><span class="s">'+h(x.bisText)+'. '+h(x.notiz)+'</span></span>' +
      rechts + '</button>';
  }).join('');
  return '<div class="block">'+kopfz+'<div class="path">'+zeilen+'</div>' +
    (tr ? '<button class="btn ghost" type="button" data-act="zuweisen">'+ICON.kalender+' Aufgabe zuweisen</button>' : '') +
  '</div>';
}
var MEDAILLE = ['#D99A06','#8E989E','#B8692B'];
function rangliste(max){
  var t = meinTeam() || TEAM, ich = ichId(), marke = CHALLENGES[0].marke;
  var leute = teamIds(t).map(person).filter(function(p){ return p && p.wert; })
    .sort(function(a, b){ return b.wert - a.wert; });
  var zeilen = [], kader = false, ichDrin = false;
  var kaderZeile = '<div class="rz coach"><span class="p"></span><img src="img/coach.jpg" alt="">' +
    '<span class="n">Kaders Marke</span><span class="v">'+marke+'</span></div>';
  leute.forEach(function(p, i){
    if(!kader && p.wert < marke){ zeilen.push(kaderZeile); kader = true; }
    var mir = p.id === ich;
    if(mir) ichDrin = true;
    zeilen.push('<div class="rz'+(mir ? ' ich' : '')+'">' +
      '<span class="p'+(i < 3 ? ' medaille' : '')+'"'+(i < 3 ? ' style="--m:'+MEDAILLE[i]+'"' : '')+'>'+(i + 1)+'</span>' +
      avatarVon(p.name, lvFarbe(p.lv)) +
      '<span class="n">'+h(p.name)+(mir ? '<small>'+(state.rolle === 'eltern' ? 'Ihr Kind' : 'Du')+'</small>' : '')+'</span>' +
      '<span class="v">'+p.wert+'</span></div>');
  });
  if(!kader) zeilen.push(kaderZeile);
  if(max && zeilen.length > max){
    var eigene = zeilen.filter(function(z){ return z.indexOf('rz ich') >= 0; })[0];
    zeilen = zeilen.slice(0, max);
    if(eigene && zeilen.indexOf(eigene) < 0) zeilen.push(eigene);
  }
  if(ich && !ichDrin){
    var p = person(ich);
    zeilen.push('<div class="rz ich"><span class="p">–</span>'+avatarVon(p.name, lvFarbe(p.lv)) +
      '<span class="n">'+h(p.name)+'<small>Noch kein bestätigter Wert</small></span><span class="v">–</span></div>');
  }
  return '<div class="rang">'+zeilen.join('')+'</div>';
}
function rangBlock(max){
  var ch = CHALLENGES[0];
  return '<div class="block">' +
    '<div class="block-head"><h2 class="sec">Rangliste</h2><span class="more">'+h(ch.eh)+' in 60 Sekunden</span></div>' +
    rangliste(max) +
    '<p class="fine">Es zählen nur Werte, die der Trainer im Video nachgezählt hat.</p>' +
  '</div>';
}
function statusPille(u){
  var s = {eltern:['orange','Wartet auf die Eltern'], trainer:['blau','Beim Trainer'], km1:['blau','Bei KM1'],
           feedback:['gruen','Feedback da'], abgelehnt:['','Nicht freigegeben']}[u.status] || ['',''];
  return '<span class="pille '+s[0]+'">'+s[1]+'</span>';
}
function uploadZeile(u, fuerTrainer){
  var p = person(u.von) || {name:u.name || '', lv:u.lv};
  var zahl = u.zahl ? u.zahl+' gezählt · ' : '';
  var unter = fuerTrainer ? h(p.name)+' · '+zahl+h(wann(u.zeit)) : zahl+h(wann(u.zeit))+' · '+h(sichtKurz(u.sicht));
  return '<button class="nzeile" type="button" data-act="clip:'+u.id+'">' +
    '<span class="poster">'+dia(u.k, u.lv)+'</span>' +
    '<span><span class="t">'+h(u.titel)+'</span><span class="m">'+unter+'</span>' +
      (fuerTrainer ? '' : '<span class="pillen" style="margin-top:7px">'+statusPille(u)+'</span>') +
    '</span></button>';
}
function meineVideosBlock(){
  var l = W.uploads.filter(function(u){ return ichBin(u.von); }).slice(0, 3);
  return '<div class="block">' +
    '<div class="block-head"><h2 class="sec">Meine Videos</h2><span class="more">Geschützt</span></div>' +
    (l.length ? '<div class="nliste">'+l.map(function(u){ return uploadZeile(u); }).join('')+'</div>' : '') +
    '<button class="btn ghost" type="button" data-act="versuch:aufgabe">'+ICON.upl+' Video hochladen</button>' +
  '</div>';
}

/* Die drei Reaktionen. Mehr gibt es fuer Kinder nicht: kein Textfeld,
   keine Zahl der Aufrufe, keine Liste, wer reagiert hat. */
var REAKTIONEN = [['feuer','🔥','Feuer'],['klatsch','👏','Applaus'],['ball','⚽','Ball']];
function reaktKnoepfe(b){
  return REAKTIONEN.map(function(x){
    var an = !!b.mein[x[0]], n = b.r[x[0]] + (an ? 1 : 0);
    return '<button class="reakt" type="button" data-act="reakt:'+b.id+':'+x[0]+'" aria-pressed="'+an+'" aria-label="'+x[2]+', '+n+'">' +
      '<span class="e" aria-hidden="true">'+x[1]+'</span>'+n+'</button>';
  }).join('');
}
function kommentarHtml(c){
  return '<div class="kommentar">'+avatarVon(c.von, '#0D7C75') +
    '<span><span class="n">'+h(c.von)+haken()+'</span><p>'+h(c.t)+'</p></span></div>';
}
function trainerSchreibt(){ return drin() && state.rolle === 'trainer' && state.geprueft; }
function beitrag(b){
  if(W.blockiert[b.von]) return '<div class="post weg">'+ICON.auge+'<span>Von einer Person, die du blockiert hast.</span></div>';
  if(W.ausgeblendet[b.id]) return '<div class="post weg">'+ICON.flagge+'<span>Gemeldet und ausgeblendet. KM1 schaut es sich an.</span></div>';
  var p = person(b.von) || {name:b.name, lv:1};
  return '<article class="post">' +
    '<div class="post-kopf">'+avatarVon(p.name, b.trainer ? '#0D7C75' : lvFarbe(p.lv)) +
      '<span class="wer"><span class="n">'+h(p.name)+(b.trainer ? haken() : '')+'</span>' +
      '<span class="m">'+h(wann(b.zeit))+(b.trainer ? ' · Trainer' : '')+'</span></span>' +
      '<button class="mehr" type="button" data-act="postmenue:'+b.id+'" aria-label="Melden oder blockieren">'+ICON.mehr+'</button></div>' +
    (b.text ? '<p class="text">'+h(b.text)+'</p>' : '') +
    (b.k ? '<button class="poster" type="button" data-act="beitrag:'+b.id+'" aria-label="Video ansehen: '+h(b.titel)+'">'+dia(b.k, b.lv) +
      '<span class="badge schutz">'+ICON.lock+' Nur '+h(TEAM.name)+'</span>' +
      '<span class="badge dur">'+fmtZeit(b.dauer || 45)+'</span></button>' +
      '<p class="text" style="font-weight:600;margin-top:-4px">'+h(b.titel)+(b.bestaetigt ? ' <span class="pille gruen" style="vertical-align:2px">Bestätigt</span>' : '')+'</p>' : '') +
    '<div class="reaktionen">'+reaktKnoepfe(b)+'</div>' +
    b.komm.map(kommentarHtml).join('') +
    (trainerSchreibt() && !b.trainer ? '<div class="schreiben"><input type="text" aria-label="Kommentar" placeholder="Als Trainer kommentieren">' +
      '<button class="btn klein" type="button" data-act="kommentar:'+b.id+'">Senden</button></div>' : '') +
  '</article>';
}
function feedBlock(){
  var t = meinTeam();
  if(!t) return '';
  var posts = W.feed.filter(function(b){ return b.team === t.id; });
  if(!posts.length) return '';
  return '<div class="block">' +
    '<div class="block-head"><h2 class="sec">Aus dem Team</h2><span class="more">Nur '+h(t.name)+'</span></div>' +
    '<div class="feed">'+posts.map(beitrag).join('')+'</div>' +
    '<p class="fine">Reagieren kann jeder mit drei festen Zeichen. Schreiben dürfen nur geprüfte Trainer. Über die drei Punkte meldest oder blockierst du.</p>' +
  '</div>';
}

function teamSpieler(){
  if(state.imTeam !== true) return spielerOhneTeam();
  var t = TEAM;
  return '<section class="screen schmal">' +
    '<div><p class="eyebrow">'+h(t.name+' · '+t.verein)+'</p><h1 class="big">Mein Team</h1></div>' +
    trainerZelle(t) +
    aufgabenBlock('spieler') +
    meineVideosBlock() +
    rangBlock(7) +
    '<button class="btn" type="button" data-act="versuch:challenge">'+ICON.upl+' Challenge-Versuch hochladen</button>' +
    feedBlock() +
  '</section>';
}

  var wartet = state.imTeam === 'wartet';

    '<div><p class="eyebrow">Noch ohne Team</p><h1 class="big">Mein Team</h1>' +
      '<p class="sub">Dein Trainer hat einen Code für die Mannschaft. Damit bist du drin.</p></div>' +

        '</div>') +
    '<div class="panel">' + liste([

      'Die Rangliste im Team für jede Challenge',
      'Feedback auf deine Videos, auf die Sekunde genau'
    ]) + '</div>' +
  '</section>';

/* ---------- Eltern ---------- */

    ico = ICON.stern; farbe = '#AF52DE'; t = 'Talentprofil für Scouts';

  } else if(f.art === 'upload'){
    var u = uploadVon(f.upload);

    s = KIND.vn+' möchte einen Versuch hochladen. Sehen würde ihn: '+sichtLang(u.sicht)+'.';

      '<button class="btn" type="button" data-act="freigabe:'+f.id+':ja">'+ja+'</button></div>' +

  }
  var k = person('luis'), t = TEAM, a = t.aufgaben;
  var z = a.filter(function(x){ return aufgabeFertig(x, 'luis'); }).length;
  var videos = W.uploads.filter(function(u){ return u.von === 'luis' && u.status !== 'eltern'; });
  var f = W.freigaben;

/* ============================================================
   Teilen als Status oder Story.
   Eine Karte im Format 9 : 16, gemalt auf einer Leinwand: Farbe der
   Ebene, Linien eines Platzes, das Logo, eine grosse Zeile in Anton.
   Auf dem Bild stehen nur der Vorname und die Leistung.
   ============================================================ */
var LV_HEX = ['#0D7C75','#3C8329','#A9630A','#C81E14'];
var teilCache = {};
function teilArten(){ return [['ebene','Ebene'],['challenge','Challenge'],['serie','Serie']]; }
function wertVon(id){ return id ? W.werte[id] : null; }
function teilDaten(art){
  var vn = state.rolle === 'eltern' ? KIND.vn : ((state.konto && state.konto.vn) || 'Ich');
  var ch = CHALLENGES[0];
  if(art === 'challenge'){
    var z = wertVon(ichId()) || (ch.marke + 1);
    return {farbe:'#C81E14', kicker:'Challenge im '+ch.m, gross:String(z), unter:ch.eh,
            band:z > ch.marke ? 'Kader geschlagen' : 'Neuer Rekord', vn:vn, zahl:true};
  }
  if(art === 'serie'){
    var n = Math.max(1, serieWochen());
    return {farbe:'#248A3D', kicker:'Dranbleiben', gross:String(n), unter:n === 1 ? 'Woche am Stück' : 'Wochen am Stück',
            band:'Jede Woche trainiert', vn:vn, zahl:true};
  }
  var l = lvOf(state.meinLv);
  /* Die erste Ebene hat jeder von Anfang an. Erreicht ist erst die zweite. */
  return {farbe:LV_HEX[l.n - 1], kicker:l.n > 1 ? 'Neue Ebene erreicht' : 'Meine Ebene', gross:l.nm, unter:l.md, band:'Ebene '+l.n+' von 4', vn:vn, ebene:l.n};
}
function mischen(hex, ziel, anteil){
  var a = parseInt(hex.slice(1), 16), b = parseInt(ziel.slice(1), 16);
  var k = function(s){ return Math.round(((a >> s) & 255) * (1 - anteil) + ((b >> s) & 255) * anteil); };
  return 'rgb('+k(16)+','+k(8)+','+k(0)+')';
}
var SCHRIFT_ANTON = "Anton, 'Arial Narrow', Impact, sans-serif";
var SCHRIFT_MONO = "'JetBrains Mono', ui-monospace, Menlo, monospace";
var SCHRIFT_TEXT = "-apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', Roboto, sans-serif";
/* Setzt die Schrift so gross wie moeglich, aber nie breiter als erlaubt. */
function passend(x, text, gewicht, schrift, max, breite){
  x.font = gewicht+' '+max+'px '+schrift;
  var w = x.measureText(text).width, g = max;
  if(w > breite){ g = Math.floor(max * breite / w); x.font = gewicht+' '+g+'px '+schrift; }
  return g;
}
function zeileMittig(x, text, y){ x.textAlign = 'center'; x.fillText(text, 540, y); }
/* Die Pyramide, die eigene Ebene weiss gefuellt. */
function pyramideMalen(x, n, oben){
  var geo = [[4, .78, 17.94, 33.67, 66.33, 26.41, 73.59], [3, 19.89, 37.05, 25.58, 74.42, 18.32, 81.68],
             [2, 39, 56.16, 17.5, 82.5, 10.24, 89.76], [1, 58.11, 75.27, 9.41, 90.59, 2.16, 97.84]];
  var s = 6.2, ox = 540 - 50 * s;
  geo.forEach(function(g){
    x.beginPath();
    x.moveTo(ox + g[3] * s, oben + g[1] * s); x.lineTo(ox + g[4] * s, oben + g[1] * s);
    x.lineTo(ox + g[6] * s, oben + g[2] * s); x.lineTo(ox + g[5] * s, oben + g[2] * s); x.closePath();
    x.fillStyle = g[0] === n ? '#FFFFFF' : (g[0] < n ? 'rgba(255,255,255,.42)' : 'rgba(255,255,255,.08)');
    x.fill();
    x.lineJoin = 'round'; x.lineWidth = 4; x.strokeStyle = g[0] <= n ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.35)';
    x.stroke();
  });
}
function logoWeiss(img){
  var o = document.createElement('canvas');
  o.width = img.naturalWidth; o.height = img.naturalHeight;
  var ox = o.getContext('2d');
  ox.drawImage(img, 0, 0);
  /* Das Logo ist dunkel auf Weiss. Wie der Filter #logoLight im Stil:
     je dunkler der Punkt, desto deckender das Weiss. */
  var px = ox.getImageData(0, 0, o.width, o.height), d = px.data;
  for(var i = 0; i < d.length; i += 4){
    var hell = d[i] * .33 + d[i+1] * .34 + d[i+2] * .33;
    d[i+3] = Math.round((255 - hell) * d[i+3] / 255);
    d[i] = d[i+1] = d[i+2] = 255;
  }
  ox.putImageData(px, 0, 0);
  return o;
}
function karteMalen(art){
  var d = teilDaten(art);
  var schriften = (document.fonts && document.fonts.load) ? Promise.all([
    document.fonts.load('400 200px Anton', 'NEUE EBENE 0123456789 ÜÖÄ'),
    document.fonts.load('700 40px "JetBrains Mono"', 'CHALLENGE'),
    document.fonts.load('600 44px Inter', 'Kader geschlagen')
  ]).catch(function(){}) : Promise.resolve();
  var logo = new Promise(function(fertig){
    var img = new Image();
    img.onload = function(){ fertig(img); };
    img.onerror = function(){ fertig(null); };
    img.src = 'img/logo.png';
  });
  return Promise.all([schriften, logo]).then(function(r){
    var c = document.createElement('canvas');
    c.width = 1080; c.height = 1920;
    var x = c.getContext('2d');

    var g = x.createLinearGradient(0, 0, 0, 1920);
    g.addColorStop(0, mischen(d.farbe, '#FFFFFF', .14));
    g.addColorStop(.48, d.farbe);
    g.addColorStop(1, mischen(d.farbe, '#000000', .74));
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
    var licht = x.createRadialGradient(540, -160, 40, 540, -160, 1250);
    licht.addColorStop(0, 'rgba(255,255,255,.26)'); licht.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = licht; x.fillRect(0, 0, 1080, 1920);

    /* Die Linien eines Platzes, blass wie Kreide. */
    x.strokeStyle = 'rgba(255,255,255,.11)'; x.lineWidth = 5;
    x.strokeRect(70, 70, 940, 1780);
    x.beginPath(); x.moveTo(70, 960); x.lineTo(1010, 960); x.stroke();
    x.beginPath(); x.arc(540, 960, 170, 0, Math.PI * 2); x.stroke();
    x.strokeRect(290, 70, 500, 240); x.strokeRect(290, 1610, 500, 240);

    var img = r[1];
    try{
      if(!img) throw new Error('kein Logo');
      var w = logoWeiss(img), lw = 290, lh = lw * img.naturalHeight / img.naturalWidth;
      x.drawImage(w, 540 - lw / 2, 150, lw, lh);
    }catch(err){
      x.fillStyle = '#FFFFFF'; passend(x, 'KM1', '400', SCHRIFT_ANTON, 110, 400); zeileMittig(x, 'KM1', 250);
    }

    var yKicker = d.ebene ? 1010 : 560, yGross = d.ebene ? 1290 : 1150, yUnter = d.ebene ? 1385 : 1300, yBand = d.ebene ? 1450 : 1390;
    if(d.ebene) pyramideMalen(x, d.ebene, 390);

    /* Die rote Zeile der Marke, hier in Weiss: Strich und Mono. */
    x.fillStyle = 'rgba(255,255,255,.88)';
    x.font = '700 38px '+SCHRIFT_MONO;
    if('letterSpacing' in x) x.letterSpacing = '5px';
    var kt = d.kicker.toUpperCase(), kw = x.measureText(kt).width, start = 540 - (kw + 58) / 2;
    x.fillRect(start, yKicker - 16, 40, 6);
    x.textAlign = 'left'; x.fillText(kt, start + 58, yKicker);
    if('letterSpacing' in x) x.letterSpacing = '0px';

    x.fillStyle = '#FFFFFF';
    passend(x, d.gross.toUpperCase(), '400', SCHRIFT_ANTON, d.zahl ? 560 : 250, 900);
    zeileMittig(x, d.gross.toUpperCase(), yGross);
    x.fillStyle = 'rgba(255,255,255,.9)';
    passend(x, d.unter.toUpperCase(), '400', SCHRIFT_ANTON, d.zahl ? 112 : 70, 880);
    zeileMittig(x, d.unter.toUpperCase(), yUnter);

    /* Das Band in Weiss, darin die Zeile in der Farbe der Karte. */
    x.font = '700 46px '+SCHRIFT_TEXT;
    var bw = x.measureText(d.band).width + 96, bx = 540 - bw / 2;
    x.fillStyle = '#FFFFFF';
    x.beginPath();
    if(x.roundRect) x.roundRect(bx, yBand, bw, 96, 48); else x.rect(bx, yBand, bw, 96);
    x.fill();
    x.fillStyle = mischen(d.farbe, '#000000', .1);
    zeileMittig(x, d.band, yBand + 64);

    x.fillStyle = 'rgba(255,255,255,.9)';
    x.font = '700 36px '+SCHRIFT_MONO;
    if('letterSpacing' in x) x.letterSpacing = '4px';
    zeileMittig(x, (d.vn+' · trainiert mit KM1').toUpperCase(), 1745);
    if('letterSpacing' in x) x.letterSpacing = '0px';
    x.fillStyle = 'rgba(255,255,255,.6)';
    x.font = '500 32px '+SCHRIFT_TEXT;
    zeileMittig(x, 'km1-training.de', 1805);

    return new Promise(function(fertig){
      var weiter = function(blob){ fertig({blob:blob, url:blob ? URL.createObjectURL(blob) : c.toDataURL('image/png')}); };
      try{ c.toBlob(weiter, 'image/png'); }catch(err){ weiter(null); }
    });
  });
}
function teilSchluessel(art){ return art+'|'+JSON.stringify(teilDaten(art)); }
/* Die Vorschau im Blatt ist das fertige Bild. So ist beim Teilen nichts
   mehr zu rechnen, und das Teilen bleibt Teil des Antippens. */
function teilVorschau(){
  var art = state.teilArt, s = teilSchluessel(art);
  var zeigen = function(r){
    teilCache[s] = r;
    var z = document.getElementById('teilbild');
    if(z && state.teilArt === art) z.innerHTML = '<img src="'+r.url+'" alt="Vorschau der Karte: '+h(teilDaten(art).kicker)+'">';
  };
  if(teilCache[s]) zeigen(teilCache[s]); else karteMalen(art).then(zeigen);
}
function sheetTeilen(){
  return kopf('Teilen') +
    '<div class="sheet-body">' +
      '<div><p class="eyebrow">Für Status und Story</p><h1 class="big">Zeig, was du geschafft hast.</h1></div>' +
      '<div class="seg">'+teilArten().map(function(a){
        return '<button type="button" data-act="teilart:'+a[0]+'" aria-pressed="'+(state.teilArt === a[0])+'">'+a[1]+'</button>';
      }).join('')+'</div>' +
      '<div class="teilbild" id="teilbild"><div class="laedt"></div></div>' +
      '<div style="display:grid;gap:10px">' +
        '<button class="btn" type="button" data-act="teilenlos:wa">'+ICON.teilen+' Als WhatsApp-Status</button>' +
        '<button class="btn ghost" type="button" data-act="teilenlos:ig">'+ICON.teilen+' Als Instagram-Story</button>' +
      '</div>' +
      '<p class="fine">Auf dem Bild stehen nur dein Vorname und deine Leistung. Kein Nachname, kein Verein, kein Ort, kein Gesicht.</p>' +
    '</div>';
}
function teilenLos(wohin){
  var r = teilCache[teilSchluessel(state.teilArt)];
  if(!r){ toast('Einen Moment, das Bild entsteht noch'); return; }
  var datei = null;
  try{ if(r.blob) datei = new File([r.blob], 'km1-'+state.teilArt+'.png', {type:'image/png'}); }catch(err){}
  if(datei && navigator.canShare && navigator.canShare({files:[datei]})){
    navigator.share({files:[datei]}).then(function(){ haptik('erfolg'); })
      .catch(function(err){ if(!err || err.name !== 'AbortError') sichern(r, wohin); });
    return;
  }
  sichern(r, wohin);
}
function sichern(r, wohin){
  /* In einer eingebetteten Vorschau, etwa auf claude.ai, gibt es weder
     Teilen noch Herunterladen. Dann sagt die App das, statt so zu tun. */
  if(window.self !== window.top){ haptik('fehler'); toast('In der Vorschau geht das nicht. Auf dem Handy öffnen.'); return; }
  try{
    var a = document.createElement('a');
    a.href = r.url; a.download = 'km1-'+state.teilArt+'.png';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(err){}
  haptik('erfolg');
  toast(wohin === 'ig' ? 'Bild gesichert. In Instagram als Story posten.' : 'Bild gesichert. In WhatsApp als Status posten.');
}

/* ============================================================
   Das Menue von unten: melden, blockieren, abbrechen
   ============================================================ */
function menueAuf(html){
  var m = document.getElementById('menue');
  clearTimeout(m._weg);
  m.innerHTML = '<div class="menue-in" role="dialog" aria-modal="true">'+html+'</div>';
  m.hidden = false;
  void m.offsetWidth;
  requestAnimationFrame(function(){ m.classList.add('an'); });
}
function menueZu(){
  var m = document.getElementById('menue');
  m.classList.remove('an');
  clearTimeout(m._weg);
  m._weg = setTimeout(function(){ m.hidden = true; m.innerHTML = ''; }, 420);
}

/* Nach einer Aenderung: die Seite neu, und das offene Blatt auch. */
function nachAenderung(blatt){
  render();
  if(blatt && stack.length) refreshSheet(blatt());
}

/* ============================================================
   Ein zweiter Klickfaenger fuer alles, was hier dazukam
   ============================================================ */
document.addEventListener('click', function(e){
  if(e.target.id === 'menue'){ menueZu(); return; }
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var a = b.getAttribute('data-act'), i = a.indexOf(':');
  var k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  var teil = v.split(':');
  var imBlatt = !!b.closest('.sheet');

  /* Vorfuehrung und Rollen */
  if(k === 'sicht'){ openSheet(sheetSicht()); }
  else if(k === 'sichtwahl'){ wechsleSicht(v); }
  else if(k === 'wahlrolle'){
    var fw = feldWerte(['lg-name','lg-mail','lg-pw','lg-jg']);
    state.wahlRolle = v; haptik('tick');
    refreshSheet(sheetLogin());
    feldWerteZurueck(fw);
  }
  else if(k === 'signin'){ /* der erste Klickfaenger meldet an */ }

  /* KM1 Team und Pruefung */
  else if(k === 'teamabo'){ haptik('wand'); openSheet(sheetTeamAbo()); }
  else if(k === 'teampreis'){ state.teamPreis = v; refreshSheet(sheetTeamAbo()); }
  else if(k === 'teambuy'){
    if(!drin()){
      haptik('wand'); state.nachLogin = 'teamabo'; state.loginModus = 'neu';
      state.wahlRolle = state.teamPreis === 'akademie' ? 'akademie' : 'trainer';
      openSheet(sheetLogin()); return;
    }
    if(state.rolle !== 'trainer' && state.rolle !== 'akademie'){ haptik('fehler'); toast('KM1 Team gibt es für Trainer und Akademien'); return; }
    state.teamAbo = true;
    haptik('aufstieg');
    while(stack.length) closeSheet();
    state.tab = 'team'; render();
    toast(state.rolle === 'akademie' ? 'KM1 Akademie ist aktiv' : 'KM1 Team ist aktiv');
  }
  else if(k === 'pruefung'){ openSheet(sheetPruefung()); }
  else if(k === 'beleg'){
    if(state.belege[v]) delete state.belege[v]; else state.belege[v] = 1;
    haptik('leicht'); refreshSheet(sheetPruefung());
  }
  else if(k === 'pruefsenden'){
    var fehlt = (BELEGE[state.rolle] || []).filter(function(x){ return !state.belege[x[0]]; });
    if(fehlt.length){ haptik('fehler'); toast('Es fehlt noch: '+fehlt[0][1]); return; }
    state.pruefung = 'laeuft';
    haptik('erfolg'); while(stack.length) closeSheet(); render();
    toast('Eingereicht. KM1 meldet sich meist in zwei Werktagen.');
  }
  else if(k === 'pruefok'){
    state.geprueft = true; state.pruefung = null;
    haptik('aufstieg'); render();
    toast('Geprüft. Der Haken ist da.');
  }

  /* Hochladen */
  else if(k === 'versuch'){
    if(!drin()){ haptik('wand'); state.loginModus = 'neu'; openSheet(sheetLogin()); return; }
    var t0 = meinTeam();
    state.versuch = {datei:null, zweck:(v === 'aufgabe' && t0 && t0.aufgaben.length) ? 'aufgabe' : 'challenge',
                     sicht:t0 ? 'trainer' : 'km1', zahl:'', busy:false};
    openSheet(sheetVersuch());
  }
  else if(k === 'vdatei'){
    var jetzt = new Date();
    state.versuch.datei = jetzt.getHours()+':'+('0'+jetzt.getMinutes()).slice(-2)+' Uhr';
    var fz = feldWerte(['v-zahl']);
    haptik('leicht'); refreshSheet(sheetVersuch()); feldWerteZurueck(fz);
  }
  else if(k === 'vzweck'){
    var fz2 = document.getElementById('v-zahl');

  else if(k === 'vsicht'){

/* Eine Freigabe der Eltern: Talentprofil, Video oder Anfrage eines Scouts. */
function freigabeEntscheiden(id, ja){
  var f = W.freigaben.filter(function(x){ return x.id === id; })[0];
  if(!f) return;
  W.freigaben = W.freigaben.filter(function(x){ return x.id !== id; });
  var text;
  if(f.art === 'talent'){
    W.talent.sichtbar = ja ? 'frei' : 'aus';
    text = ja ? 'Freigegeben. Geprüfte Scouts sehen jetzt das Profil.' : 'Abgelehnt. Das Profil bleibt privat.';
  } else if(f.art === 'upload'){
    var u = uploadVon(f.upload);
    u.status = ja ? (u.sicht === 'km1' ? 'km1' : 'trainer') : 'abgelehnt';
    text = ja ? 'Freigegeben. '+(u.sicht === 'km1' ? 'KM1' : vorname(TEAM.trainer))+' sieht das Video jetzt.' : 'Abgelehnt. Das Video ist gelöscht.';
  } else {
    var a = anfrageVon(f.anfrage);
    a.status = ja ? 'angenommen' : 'abgelehnt';
    text = ja ? vorname(a.scout)+' bekommt Ihre E-Mail-Adresse, nicht die von '+KIND.vn+'.' : 'Abgelehnt. '+vorname(a.scout)+' erfährt nur, dass es gerade nicht passt.';
  }
  haptik(ja ? 'erfolg' : 'leicht');
  if(stack.length) closeSheet();
  render();
  toast(text);
}

/* Das Hochladen: ein Balken, dann liegt das Video beim Trainer oder
   zuerst bei den Eltern. */
function versuchSenden(){
  var v = state.versuch;
  if(v.busy) return;
  if(!v.datei){ haptik('fehler'); toast('Erst ein Video auswählen'); return; }
  var zahl = 0, aufId = null;
  if(v.zweck === 'challenge'){
    zahl = parseInt((document.getElementById('v-zahl') || {}).value, 10);
    if(!(zahl > 0 && zahl < 500)){ haptik('fehler'); toast('Trag ein, wie viele du geschafft hast'); return; }
  } else {
    aufId = (document.getElementById('v-auf') || {}).value;
    if(!aufId){ haptik('fehler'); toast('Du hast gerade keine Hausaufgabe'); return; }
  }
  v.busy = true;
  var bar = document.getElementById('v-bar'), go = document.getElementById('v-go');
  bar.hidden = false; go.textContent = 'Lädt hoch …';
  var p = 0, takt = setInterval(function(){
    p += 8;
    bar.firstElementChild.style.width = Math.min(p, 100)+'%';
    if(p < 100) return;
    clearInterval(takt);
    var ch = CHALLENGES[0], vid = aufId ? byId(aufId) : null, t = meinTeam();
    var eltern = state.rolle === 'spieler' && alterVon(state.jahrgang) < 16 && W.einst.upload;
    var u = {id:'v-'+Date.now(), von:ichId() || 'neu', team:t ? t.id : 'u13', zweck:v.zweck,
      titel:vid ? vid.t.replace(/­/g, '') : ch.t, zahl:zahl || null,
      k:vid ? vid.k : 'dribbling', lv:vid ? vid.lv : state.meinLv, dauer:58, sicht:v.sicht,
      status:eltern ? 'eltern' : (v.sicht === 'km1' ? 'km1' : 'trainer'), zeit:Date.now(), feedback:[]};
    W.uploads.unshift(u);
    if(eltern) W.freigaben.unshift({id:'fg-'+u.id, art:'upload', upload:u.id, zeit:Date.now()});
    state.versuch = {datei:null, zweck:'challenge', sicht:'trainer', zahl:'', busy:false};
    haptik('erfolg');
    while(stack.length) closeSheet();
    state.tab = 'team'; letzterTab = null; render();
    toast(eltern ? 'Hochgeladen. Deine Eltern geben es frei.'
                 : (u.sicht === 'km1' ? 'Hochgeladen. KM1 schaut es sich an.' : 'Hochgeladen. '+vorname((t || TEAM).trainer)+' schaut es sich an.'));
  }, 90);
}

/* Unter der Challenge: teilen, hochladen, die Rangliste im Team. */
function challengeExtras(fertig){
  var out = '';
  if(fertig) out += '<button class="btn text" type="button" data-act="teilen:challenge" style="margin-top:-14px">'+ICON.teilen+' Als Status teilen</button>';
  if(drin() && (state.rolle === 'spieler' || state.rolle === 'eltern'))
    out += '<button class="btn ghost" type="button" data-act="versuch:challenge">'+ICON.upl+' Versuch hochladen</button>';
  if(meinTeam() && teamIds(meinTeam()).length) out += rangBlock(6);
  return out;
}

/* ============================================================
   Start. Steht hier am Ende, weil die Startseite Rollen, Teams und
   Neuigkeiten aus diesem Skript braucht.
   ============================================================ */
applyTheme();
render();
if(window.km1Start) window.km1Start.fertig('app');

/* Punkt 11: die Platzhalterkarten. Den Zeitpunkt gibt jetzt der
   Startbildschirm vor — kurz bevor er abblendet, stehen die echten
   Karten schon da. So gibt es einen Uebergang statt zweier
   Ladezustaende hintereinander. Der Zeitgeber faengt den Fall ab,
   dass es den Startbildschirm nicht gibt.

   In der fertigen App endet der Zustand, wenn die Videoliste vom
   Server da ist; heute liegt sie im Dokument. */
(function(){
  var fertig = function(){
    if(!state.laedt) return;
    state.laedt = false;
    letzterTab = null;      /* damit die Bloecke einmal aufblenden */
    render();
  };
  if(window.km1Start) window.km1Start.kurzVorSchluss(fertig);
  setTimeout(fertig, 2600);
})();
</script>
