/* ============================================================
   Haptik.
   Ein Impuls bestaetigt, was passiert ist — er schmueckt nicht.
   Was oefter als ein paarmal pro Minute vorkommt, schweigt: Tabs,
   Blaetter, Filter, Play. Und nie zwei Impulse fuer eine Handlung.

   Im Web laeuft das nur auf Android: navigator.vibrate hat WebKit nie
   eingebaut, und damit kennt es kein Browser auf dem iPhone. Unten
   steht ein Versuch ueber einen versteckten Schalter — der greift auf
   iOS 17.4 bis 26.4 und gibt auch dort nur einen einzelnen Tick her.
   Seit iOS 26.5 klopft nur noch ein echter Fingertipp auf den Schalter
   selbst, nicht mehr ein click() aus dem Skript.

   Verloren ist der Entwurf deshalb nicht, im Gegenteil: die echte App
   nimmt expo-haptics und spricht die Taptic Engine direkt an, und die
   ist praeziser als jeder Vibrationsmotor in einem Android-Geraet.
   Welches Muster auf welchen Aufruf geht, steht in KONZEPT.md.
   ============================================================ */
var MUSTER = {
  tick:     [7],                  /* rasten, wie ein Schieberegler */
  leicht:   [14],                 /* verstanden */
  mittel:   [24],                 /* Zustand gewechselt */
  wand:     [30],                 /* hier geht es nicht weiter */
  erfolg:   [16, 45, 26],         /* geschafft */
  serie:    [14, 40, 14, 40, 28], /* erster Haken des Tages */
  aufstieg: [14, 55, 14, 55, 40], /* leicht, leicht, kraeftig */
  fehler:   [22, 70, 22]          /* so nicht */
};
var letzterImpuls = 0;
function haptik(name){
  var m = MUSTER[name];
  if(!m) return;
  var jetzt = Date.now();
  if(jetzt - letzterImpuls < 60) return;   /* zwei Impulse stapeln sich nicht */
  letzterImpuls = jetzt;
  try{
    if(navigator.vibrate){ navigator.vibrate(m); return; }
  }catch(e){}
  iosImpuls();
}
/* Safari 17.4 bis 26.4 laesst den Schalter im Formular klopfen, wenn
   der Klick ueber sein Label laeuft. Ab 26.5 hat Apple das zugemacht.
   Der Aufruf bleibt trotzdem stehen: er kostet nichts, schadet nichts
   und hilft auf aelteren Geraeten. Gibt es ihn nicht, bleibt es still —
   ohne Ersatzanzeige, denn ein Impuls, den man sieht, ist keiner. */
var iosSchalter;
function iosImpuls(){
  if(iosSchalter === false) return;
  if(!iosSchalter){
    var feld = document.createElement('input');
    feld.type = 'checkbox';
    if(!('switch' in feld)){ iosSchalter = false; return; }
    feld.setAttribute('switch', '');
    var huelle = document.createElement('label');
    huelle.setAttribute('aria-hidden', 'true');
    huelle.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
    huelle.appendChild(feld);
    document.body.appendChild(huelle);
    iosSchalter = huelle;
  }
  try{ iosSchalter.click(); }catch(e){}
}

/* ============================================================
   Der Player.
   Noch ohne echte Datei: die Leiste laeuft, das Standbild bleibt
   stehen. Bedient wird er wie gewohnt — Doppeltipp links und rechts
   springt fuenf Sekunden, die Leiste laesst sich ziehen, und das
   Tempo sitzt im Vollbild, wo es niemandem im Weg steht.
   ============================================================ */
var P = {id:null, titel:'', poster:'', dauer:0, sek:0, laeuft:false, takt:null,
         kino:false, zieht:null, tippZeit:0, tippSeite:'', ruhe:null};

function stopPlayer(){
  merkeStelle();
  if(P.takt){ clearInterval(P.takt); P.takt = null; }
  P.laeuft = false;
}

/* Wo jemand stehen geblieben ist. Ganz am Anfang und fast am Ende
   zaehlt nicht — sonst steht auf der Startseite ein Video, das man
   schon gesehen hat. */
function merkeStelle(){
  if(!P.id || P.id === 'challenge' || !P.dauer) return;
  if(P.sek < 5 || P.sek / P.dauer > 0.95){ delete state.gesehen[P.id]; return; }
  state.gesehen[P.id] = P.sek;
  state.zuletzt = P.id;
}

/* Die beiden Haelften zum Doppeltippen, dazu die Anzeige, die
   kurz aufblitzt, damit man den Sprung auch sieht. */
function zonen(){
  return '<div class="zone links" data-zone="links"></div>' +
    '<div class="zone rechts" data-zone="rechts"></div>' +
    '<span class="sprung links" data-sprung="links">'+ICON.rew+'5 s</span>' +
    '<span class="sprung rechts" data-sprung="rechts">'+ICON.rew+'5 s</span>';
}

function steuerung(gross){
  var pr = P.dauer ? (P.sek / P.dauer * 100) : 0;
  return '<div class="pctl'+(gross ? ' gross' : '')+'">' +
    '<button class="mini" type="button" data-act="play" aria-label="Abspielen oder anhalten">' +
      (P.laeuft ? ICON.pause : ICON.play) + '</button>' +
    '<span class="tm zeit">'+fmtZeit(P.sek)+'</span>' +
    '<span class="scrub" data-scrub><span class="spur">' +
      '<i style="width:'+pr+'%"></i><b class="griff" style="left:'+pr+'%"></b></span></span>' +
    '<span class="tm">'+fmtZeit(P.dauer)+'</span>' +
    (gross
      ? '<button class="mini tempo" type="button" data-act="tempo">'+tempoLabel()+'</button>' +
        '<button class="mini" type="button" data-act="kinozu" aria-label="Vollbild beenden">'+ICON.klein+'</button>'
      : '<button class="mini" type="button" data-act="kino" aria-label="Vollbild">'+ICON.voll+'</button>') +
  '</div>';
}

/* o = {id, titel, poster, dauer}. Ein anderes Video faengt vorne an,
   dasselbe behaelt seine Stelle, auch wenn das Blatt neu gebaut wird. */
function playerInline(o){
  /* Ein anderes Video steigt da ein, wo man aufgehoert hat. */
  if(P.id !== o.id){ stopPlayer(); P.id = o.id; P.sek = state.gesehen[o.id] || 0; }
  P.titel = o.titel; P.poster = o.poster; P.dauer = o.dauer;
  return '<div class="player" id="player">' +
    '<div class="poster">'+o.poster+'</div>' +
    zonen() +
    '<button class="pbtn" type="button" data-act="play" aria-label="Abspielen"'+(P.laeuft ? ' hidden' : '')+'>' +
      '<span>'+ICON.play+'</span></button>' +
    steuerung(false) +
  '</div>';
}

/* Alle sichtbaren Leisten nachfuehren, drinnen wie im Vollbild. */
function zeichnePlayer(){
  var pr = P.dauer ? (P.sek / P.dauer * 100) : 0, zt = fmtZeit(P.sek);
  [].forEach.call(document.querySelectorAll('.pctl'), function(c){
    var i = c.querySelector('.spur i');   if(i) i.style.width = pr+'%';
    var g = c.querySelector('.griff');    if(g) g.style.left  = pr+'%';
    var z = c.querySelector('.zeit');     if(z) z.textContent = zt;
    var m = c.querySelector('.mini');     if(m) m.innerHTML   = P.laeuft ? ICON.pause : ICON.play;
    var t = c.querySelector('.tempo');    if(t) t.textContent = tempoLabel();
  });
  var kap = document.querySelectorAll('[data-act^="kapitel:"]');
  if(kap.length){
    var jetzt = -1;
    for(var i = 0; i < kap.length; i++){
      if(P.sek + 0.5 >= parseFloat(kap[i].getAttribute('data-act').split(':')[1])) jetzt = i;
    }
    for(var j = 0; j < kap.length; j++) kap[j].parentNode.classList.toggle('jetzt', j === jetzt);
  }
  var pb = document.querySelector('#player .pbtn[data-act="play"]');
  if(pb) pb.hidden = P.laeuft;
  var kp = document.querySelector('.kino-play');
  if(kp){
    kp.hidden = P.laeuft;
    var sp = kp.querySelector('span'); if(sp) sp.innerHTML = ICON.play;
  }
}

function spiele(an){
  if(!P.id) return;
  var neu = (an === undefined) ? !P.laeuft : an;
  if(P.takt){ clearInterval(P.takt); P.takt = null; }
  if(neu && P.sek >= P.dauer) P.sek = 0;
  P.laeuft = neu;
  if(neu){
    P.takt = setInterval(function(){
      P.sek = Math.min(P.dauer, P.sek + 0.25 * state.tempo);
      merkeStelle();
      if(P.sek >= P.dauer){ stopPlayer(); }
      zeichnePlayer();
    }, 250);
    if(P.kino) ruhePlanen();
  } else if(P.kino){ steuerungZeigen(); }
  zeichnePlayer();
}

function springe(sek){
  if(!P.id) return;
  var vorher = P.sek;
  P.sek = Math.max(0, Math.min(P.dauer, P.sek + sek));
  /* Steht die Zeit schon am Rand, spuert man die Wand statt des Sprungs. */
  haptik(P.sek === vorher ? 'wand' : 'leicht');
  zeigeSprung(sek < 0 ? 'links' : 'rechts');
  zeichnePlayer();
}
function zeigeSprung(seite){
  var feld = document.getElementById('kino') || document.getElementById('player');
  if(!feld) return;
  var el = feld.querySelector('[data-sprung="'+seite+'"]');
  if(!el) return;
  el.classList.add('an');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('an'); }, 520);
}

/* Ein Tipp macht Pause, zwei springen. Deshalb wartet der erste Tipp
   kurz ab, ob ein zweiter kommt. */
function zonenTipp(seite){
  var jetzt = Date.now();
  if(P.tippSeite === seite && jetzt - P.tippZeit < 340){
    P.tippZeit = 0;
    springe(seite === 'links' ? -5 : 5);
    return;
  }
  P.tippZeit = jetzt; P.tippSeite = seite;
  setTimeout(function(){
    if(P.tippZeit !== jetzt) return;
    P.tippZeit = 0;
    if(P.kino && P.laeuft && !document.getElementById('kino').classList.contains('ruhe')) ruheSofort();
    else if(P.kino) steuerungZeigen();
    else spiele();
  }, 340);
}

/* Die Leiste ziehen. Waehrend des Ziehens laeuft die Zeit weiter,
   aber der Griff gehoert dem Finger. */
function scrubZu(e, sc){
  var spur = sc.querySelector('.spur'), r = spur.getBoundingClientRect();
  /* Im gedrehten Vollbild laeuft die Leiste von oben nach unten. */
  var quer = !!(sc.closest && sc.closest('.dreh.quer'));
  var roh = quer ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  var pr = Math.max(0, Math.min(1, roh));
  /* Am Anfang und am Ende einmal anstossen, nicht dauernd. */
  if(pr === 0 || pr === 1){ if(P.rand !== pr){ P.rand = pr; haptik('wand'); } }
  else P.rand = null;
  P.sek = pr * P.dauer;
  zeichnePlayer();
}

/* ---------- Vollbild ---------- */
function kinoAuf(){
  if(!P.id || P.kino) return;
  P.kino = true;
  haptik('mittel');
  var el = document.createElement('div');
  el.className = 'kino'; el.id = 'kino';
  el.innerHTML =
    '<div class="dreh" id="dreh">' +
    '<div class="kino-bild"><div class="poster">'+P.poster+'</div></div>' +
    zonen() +
    '<div class="kino-oben">' +
      '<button class="rund" type="button" data-act="kinozu" aria-label="Vollbild beenden">'+ICON.x+'</button>' +
      '<span class="kino-titel">'+h(P.titel)+'</span></div>' +
    '<button class="kino-play" type="button" data-act="play" aria-label="Abspielen"'+(P.laeuft ? ' hidden' : '')+'>' +
      '<span>'+ICON.play+'</span></button>' +
    steuerung(true) +
    '<div class="tempoliste" id="tempoliste" hidden>' +
      TEMPI.map(function(t){
        return '<button type="button" data-act="tempowahl:'+t+'"'+(state.tempo===t ? ' aria-pressed="true"' : '')+'>' +
          tempoText(t)+'</button>';
      }).join('') +
    '</div></div>';
  document.querySelector('.device').appendChild(el);
  if(echtesVollbild()){ try{ el.requestFullscreen().catch(function(){}); }catch(e){} }
  drehAnpassen();
  window.addEventListener('resize', drehAnpassen);
  requestAnimationFrame(function(){ el.classList.add('an'); });
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
  steuerungZeigen();
}
/* Am Schreibtisch heisst Vollbild wirklich Vollbild: das Fenster gibt
   seine Leisten ab. Auf dem Handy gibt es das nicht — dort bleibt es
   die gedrehte Flaeche aus drehAnpassen. */
function amSchreibtisch(){
  /* Dieselbe Schwelle wie im Stil. Absichtlich ohne pointer:fine:
     ein Tablet im Querformat soll die grosse Fassung bekommen. */
  return window.matchMedia('(min-width:1000px)').matches;
}
function echtesVollbild(){
  return amSchreibtisch() && !!document.fullscreenEnabled;
}
document.addEventListener('fullscreenchange', function(){
  /* Wer mit Escape aus dem Vollbild geht, will auch aus dem Kino. */
  if(!document.fullscreenElement && P.kino && amSchreibtisch()) kinoZu();
});

function drehAnpassen(){
  var el = document.getElementById('kino'), d = document.getElementById('dreh');
  if(!el || !d) return;
  var r = el.getBoundingClientRect();
  if(r.height > r.width){
    d.classList.add('quer');
    d.style.width = r.height+'px'; d.style.height = r.width+'px';
  } else {
    d.classList.remove('quer');
    d.style.width = ''; d.style.height = '';
  }
}
function kinoZu(){
  if(P.kino) haptik('mittel');
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); }catch(e){}
  window.removeEventListener('resize', drehAnpassen);
  var el = document.getElementById('kino');
  if(el){ el.classList.remove('an'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 240); }
  P.kino = false;
  clearTimeout(P.ruhe);
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  zeichnePlayer();
}
/* Im Vollbild zieht sich die Bedienung zurueck, sobald das Video laeuft. */
function steuerungZeigen(){
  var el = document.getElementById('kino');
  if(!el) return;
  el.classList.remove('ruhe');
  ruhePlanen();
}
function ruhePlanen(){
  clearTimeout(P.ruhe);
  if(!P.laeuft) return;
  P.ruhe = setTimeout(ruheSofort, 2600);
}
function ruheSofort(){
  var el = document.getElementById('kino');
  if(!el || !P.laeuft) return;
  el.classList.add('ruhe');
  var li = document.getElementById('tempoliste');
  if(li) li.hidden = true;
}

document.addEventListener('pointerdown', function(e){
  var sc = e.target.closest && e.target.closest('[data-scrub]');
  if(!sc) return;
  P.zieht = sc;
  P.rand = null;
  haptik('tick');
  try{ sc.setPointerCapture(e.pointerId); }catch(err){}
  scrubZu(e, sc);
  steuerungZeigen();
  e.preventDefault();
});
document.addEventListener('pointermove', function(e){
  if(P.zieht) scrubZu(e, P.zieht);
});
document.addEventListener('pointerup', function(e){
  if(P.zieht){ P.zieht = null; haptik('tick'); ruhePlanen(); return; }
  var z = e.target.closest && e.target.closest('[data-zone]');
  if(z) zonenTipp(z.getAttribute('data-zone'));
});
document.addEventListener('pointercancel', function(){ P.zieht = null; });

/* Das Portrait in gross. Liegt ueber allem, geht bei jedem Klick und
   mit Escape wieder zu. */
function portraitAuf(){
  if(document.getElementById('lupe')) return;
  var el = document.createElement('div');
  el.className = 'lupe'; el.id = 'lupe';
  el.innerHTML = '<img src="img/coach.jpg" alt="">';
  el.addEventListener('click', portraitZu);
  document.querySelector('.device').appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('an'); });
}
function portraitZu(){
  var el = document.getElementById('lupe');
  if(!el) return;
  el.classList.remove('an');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 240);
}

/* Tastatur am Schreibtisch: was man von einem Videoplayer erwartet.
   Leertaste und K halten an, die Pfeile springen fuenf Sekunden, F
   schaltet das Vollbild, Escape geht zurueck. */
document.addEventListener('keydown', function(e){
  var feld = e.target && e.target.tagName;
  if(feld === 'INPUT' || feld === 'TEXTAREA' || feld === 'SELECT') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;

  if(k === 'Escape'){
    if(document.getElementById('lupe')) portraitZu();
    else if(P.kino) kinoZu();
    else if(stack.length) closeSheet();
    return;
  }
  /* Nur wenn ein Player wirklich zu sehen ist. */
  if(!P.id || !(P.kino || document.getElementById('player'))) return;

  if(k === ' ' || k === 'k' || k === 'K'){ e.preventDefault(); spiele(); }
  else if(k === 'ArrowLeft' || k === 'j' || k === 'J'){ e.preventDefault(); springe(-5); }
  else if(k === 'ArrowRight' || k === 'l' || k === 'L'){ e.preventDefault(); springe(5); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); if(P.kino) kinoZu(); else kinoAuf(); }
});

/* ============================================================
   Zeichnen
   ============================================================ */
function applyTheme(){
  var t = state.theme, dunkel;
  if(t === 'auto'){
    dunkel = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } else {
    dunkel = (t === 'dunkel');
  }
  document.documentElement.setAttribute('data-theme', dunkel ? 'dark' : 'light');
}
function renderTabs(){
  var t = [
    ['start','Start',ICON.tabStart],['technik','Technik',ICON.tabTech],
    ['pyramide','Pyramide',ICON.tabPyr],['profil','Profil',ICON.tabProf]
  ];
  document.getElementById('tabs').innerHTML = t.map(function(x){
    return '<button class="tab" type="button" data-act="tab:'+x[0]+'"'+(state.tab===x[0]?' aria-current="page"':'')+'>' +
      '<span class="ti">'+x[2]+'</span><span>'+x[1]+'</span></button>';
  }).join('');
}
var letzterTab = null;
function render(){
  var s = {start:screenStart, technik:screenTechnik, pyramide:screenPyramide, profil:screenProfil}[state.tab];
  var flaeche = document.getElementById('screens');
  /* Beim Neuzeichnen derselben Seite bleibt die Liste stehen, wo sie stand;
     ein Tabwechsel faengt oben an. */
  var tabWechsel = state.tab !== letzterTab;
  var y = tabWechsel ? 0 : flaeche.scrollTop;
  /* Auch die waagerechten Leisten bleiben stehen, wo sie standen. Sonst
     springt die gerade angetippte Schaltflaeche aus dem Bild, weil die
     Leiste beim Neuzeichnen wieder von vorne anfaengt. */
  var x = (!tabWechsel)
    ? [].map.call(flaeche.querySelectorAll('.chips,.row'), function(l){ return l.scrollLeft; })
    : [];
  flaeche.innerHTML = s();
  flaeche.scrollTop = y;
  [].forEach.call(flaeche.querySelectorAll('.chips,.row'), function(l, i){
    if(x[i]) l.scrollLeft = x[i];
  });
  letzterTab = state.tab;
  /* Der Titel in der Kopfzeile, der beim Scrollen einblendet. */
  var kt = document.getElementById('kopftitel');
  if(kt) kt.textContent = {start:'Start', technik:'Technik', pyramide:'Pyramide', profil:'Profil'}[state.tab] || '';
  var ab = document.querySelector('.appbar');
  if(ab && y === 0) ab.classList.remove('tief', 'scrolled');

  /* Punkt 12: die Farbe der eigenen Ebene als Leitfarbe. Ohne Konto
     bleibt es beim Rot der Marke. */
  document.documentElement.style.setProperty('--mein',
    drin() ? lvOf(state.meinLv).c : 'var(--accent)');

  /* Punkt 10: nur beim Wechsel der Seite blenden die Bloecke auf. */
  if(tabWechsel){
    var sec = flaeche.querySelector('.screen');
    if(sec){
      sec.classList.add('frisch');
      [].forEach.call(sec.children, function(kind, i){
        kind.style.animationDelay = Math.min(i * 45, 200) + 'ms';
      });
    }
  }
  renderTabs();
  var chip = document.getElementById('lvchip');
  if(drin()){
    var l = lvOf(state.meinLv);
    chip.innerHTML = '<i style="background:'+l.c+'"></i>'+l.nm;
  } else {
    chip.innerHTML = '<i style="background:var(--ink-3)"></i>Gast';
  }
}
var toastT = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove('on'); }, 2300);
}
function anmelden(name){
  state.konto = {name: name || 'Luis M.', vn: (name || 'Luis M.').split(' ')[0]};
  if(!Object.keys(state.done).length){
    state.done = {'erste-beruehrung':1, 'flacher-pass':1, 'abstoppen':1, 'flanke-innen':1};
  }
}

/* ============================================================
   Ein Klickfaenger fuer alles
   ============================================================ */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var a = b.getAttribute('data-act'), i = a.indexOf(':');
  var k = i<0 ? a : a.slice(0,i), v = i<0 ? '' : a.slice(i+1);

  if(k==='tab'){ state.tab = v; while(stack.length) closeSheet(); render(); }
  else if(k==='video'){ openSheet(sheetVideo(v)); }
  else if(k==='back'){ closeSheet(); }
  else if(k==='challenge'){ openSheet(sheetChallenge()); }
  else if(k==='paywall'){ haptik('wand'); openSheet(sheetPaywall()); }
  else if(k==='preis'){ state.preis = v; refreshSheet(sheetPaywall()); }
  else if(k==='login'){ state.loginModus = (v==='alt') ? 'alt' : 'neu'; openSheet(sheetLogin()); }
  else if(k==='kontologin'){
    haptik('wand');
    state.nachLogin = 'video:'+v; state.loginModus = 'neu';
    openSheet(sheetLogin('Dieses Video gehört zu den '+zaehl('konto')+', für die ein kostenloses Konto reicht.'));
  }
  else if(k==='lmodus'){ state.loginModus = v; refreshSheet(sheetLogin()); }
  else if(k==='signin'){
    var nm = (document.getElementById('lg-name')||{}).value;
    var mail = (document.getElementById('lg-mail')||{}).value || '';
    /* Die Trainerrolle haengt am Konto, nicht an einem Schalter. */
    var trainer = /kader|km1-training/i.test(mail);
    state.owner = trainer;
    anmelden(trainer ? 'Kader' : (nm && nm.trim() ? nm.trim() : 'Luis M.'));
    closeSheet();
    var n = state.nachLogin; state.nachLogin = null;
    render();
    /* Anmelden und der aufgeschobene Haken sind ein Vorgang, nicht zwei:
       es gibt einen Impuls, und zwar den fuer das, was der Nutzer wollte. */
    if(n && n.indexOf('check:')===0){
      var cid = n.slice(6);
      state.done[cid] = 1;
      var aufL = pruefeAufstieg();
      haptik(aufL ? 'aufstieg' : (state.serieHeute ? 'erfolg' : 'serie'));
      state.serieHeute = 1;
      render();
      if(aufL){ openSheet(sheetAufstieg()); toast('Angemeldet. Abgehakt.'); return; }
      if(stack.length) refreshSheet(cid.indexOf('challenge-')===0 ? sheetChallenge() : sheetVideo(cid));
      toast('Angemeldet. Abgehakt.');
    }
    else if(n && n.indexOf('video:')===0){
      haptik('erfolg');
      var vid = n.slice(6);
      if(stack.length) refreshSheet(sheetVideo(vid)); else openSheet(sheetVideo(vid));
      toast('Angemeldet, Video ist offen');
    }
    else if(n === 'pro'){ haptik('erfolg'); openSheet(sheetPaywall()); toast('Angemeldet'); }
    else { haptik('erfolg'); toast('Angemeldet'); }
  }
  else if(k==='logout'){
    state.konto = null; state.pro = false; state.owner = false; state.done = {};
    state.symbol = 'standard'; state.merk = {};
    render(); toast('Abgemeldet');
  }
  else if(k==='buy'){
    if(!drin()){ haptik('wand'); state.nachLogin = 'pro'; state.loginModus='neu'; openSheet(sheetLogin('Für ein Abo braucht es ein Konto, sonst weiß niemand, wem PRO gehört.')); return; }
    state.pro = true;
    haptik('aufstieg');          /* Ein Kauf muss ankommen */
    while(stack.length) closeSheet();
    render(); toast('KM1 Pro ist aktiv');
  }
  else if(k==='check'){
    if(!drin()){
      haptik('wand');
      state.nachLogin = 'check:'+v; state.loginModus='neu';
      openSheet(sheetLogin('Damit dein Fortschritt gespeichert wird, brauchst du ein Konto.'));
      return;
    }
    var auf = false;
    if(state.done[v]){
      delete state.done[v];
      haptik('leicht');          /* Rueckgaengig ist keine Belohnung */
    } else {
      state.done[v] = 1;
      auf = pruefeAufstieg();
      /* Der groessere Impuls gewinnt: wer durch den Haken aufsteigt,
         spuert den Aufstieg, nicht den Haken. Der erste Haken des Tages
         traegt die Serie — hier im Entwurf der erste seit dem Start,
         spaeter der erste im Kalendertag. */
      haptik(auf ? 'aufstieg' : (state.serieHeute ? 'erfolg' : 'serie'));
      state.serieHeute = 1;
    }
    var istCh = v.indexOf('challenge-')===0;
    refreshSheet(istCh ? sheetChallenge() : sheetVideo(v));
    if(auf){ render(); openSheet(sheetAufstieg()); return; }
    toast(state.done[v] ? 'Abgehakt. Stark.' : 'Haken entfernt');
  }
  else if(k==='play'){ spiele(); }
  else if(k==='kapitel'){
    if(!P.id) return;
    P.sek = Math.max(0, Math.min(P.dauer, parseFloat(v)));
    haptik('leicht');
    zeichnePlayer();
    var pl = document.getElementById('player');
    if(pl) pl.scrollIntoView({block:'start', behavior:'smooth'});
  }
  else if(k==='kino'){ kinoAuf(); }
  else if(k==='kinozu'){ kinoZu(); }
  else if(k==='tempo'){
    var li = document.getElementById('tempoliste');
    if(li){ li.hidden = !li.hidden; steuerungZeigen(); }
  }
  else if(k==='tempowahl'){
    state.tempo = parseFloat(v);
    haptik('tick');              /* rastet wie ein Rad */
    var li2 = document.getElementById('tempoliste');
    if(li2){
      li2.hidden = true;
      [].forEach.call(li2.children, function(kn){
        if(parseFloat(kn.getAttribute('data-act').split(':')[1]) === state.tempo) kn.setAttribute('aria-pressed','true');
        else kn.removeAttribute('aria-pressed');
      });
    }
    if(P.laeuft) spiele(true); else zeichnePlayer();
    steuerungZeigen();
  }
  else if(k==='portrait'){ portraitAuf(); }
  else if(k==='eltern'){ openSheet(sheetEltern()); }
  else if(k==='symbol'){ openSheet(sheetSymbol()); }
  else if(k==='merkliste'){ openSheet(sheetMerk()); }
  else if(k==='merk'){
    if(!drin()){
      haptik('wand');
      state.nachLogin = 'video:'+v; state.loginModus = 'neu';
      openSheet(sheetLogin('Damit deine Merkliste erhalten bleibt, brauchst du ein Konto.'));
      return;
    }
    if(state.merk[v]) delete state.merk[v]; else state.merk[v] = 1;
    haptik('leicht');
    refreshSheet(sheetVideo(v));
    toast(state.merk[v] ? 'Gemerkt' : 'Aus der Merkliste genommen');
  }
  else if(k==='daten'){ openSheet(sheetDaten()); }
  else if(k==='loeschen'){ toast('Wir schicken dir eine E-Mail zur Bestätigung'); }
  else if(k==='restore'){ toast('Keine früheren Käufe gefunden'); }
  else if(k==='sym'){
    if(v==='pro' && !state.pro){ haptik('wand'); openSheet(sheetPaywall()); return; }
    state.symbol = v;
    haptik('leicht');
    refreshSheet(sheetSymbol());
    toast(v==='pro' ? 'Symbol: Flutlicht' : 'Symbol: Standard');
  }
  else if(k==='erinnerung'){ openSheet(sheetErinnerung()); }
  else if(k==='eran'){ state.erinnerung.an = (v==='1'); haptik('leicht'); refreshSheet(sheetErinnerung()); }
  else if(k==='ertag'){
    var ix = state.erinnerung.tage.indexOf(v);
    if(ix>=0) state.erinnerung.tage.splice(ix,1); else state.erinnerung.tage.push(v);
    state.erinnerung.tage.sort(function(x,y){
      return TAGE.map(function(t){return t[0];}).indexOf(x) - TAGE.map(function(t){return t[0];}).indexOf(y);
    });
    refreshSheet(sheetErinnerung());
  }
  else if(k==='ersave'){
    var z = document.getElementById('er-zeit');
    if(z) state.erinnerung.zeit = z.value;
    if(state.erinnerung.an && !state.erinnerung.tage.length){ haptik('fehler'); toast('Wähl mindestens einen Tag'); return; }
    closeSheet(); render();
    toast(state.erinnerung.an ? 'Erinnerung: '+erinnerungText() : 'Erinnerung aus');
  }
  else if(k==='lv'){ state.lvSel = +v; render(); }
  else if(k==='kat'){ state.kat = v; render(); }
  else if(k==='ebwahl'){ openSheet(sheetEbene()); }
  else if(k==='fltlv'){ state.fltLv = +v; if(stack.length) closeSheet(); render(); }
  else if(k==='theme'){ state.theme = v; haptik('leicht'); applyTheme(); render(); }
  else if(k==='upload'){ openSheet(sheetUpload()); }
  else if(k==='pickfile'){ state.up.datei = 'flanke-innenseite-2026.mp4'; refreshSheet(sheetUpload()); }
  else if(k==='uplv'){ state.up.lv = +v; refreshSheet(sheetUpload()); }
  else if(k==='upvis'){ state.up.vis = v; refreshSheet(sheetUpload()); }
  else if(k==='publish'){ publish(); }
  else if(k==='camps'){ openSheet(sheetCamp()); }
});

document.addEventListener('keydown', function(e){
  var g = e.target.closest && e.target.closest('.plate');
  if(g && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); g.click(); }
});

document.addEventListener('input', function(e){
  if(e.target.id==='suche'){
    state.suche = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var f = document.getElementById('suche');
    if(f){ f.focus(); try{ f.setSelectionRange(pos,pos); }catch(err){} }
  }
});

if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      if(state.theme==='auto') applyTheme();
    });
  }catch(err){}
}

function publish(){
  var u = state.up;
  var titel = (document.getElementById('up-titel')||{}).value || '';
  if(!u.datei){ haptik('fehler'); toast('Erst ein Video auswählen'); return; }
  if(!titel.trim()){ haptik('fehler'); toast('Der Titel fehlt'); return; }
  if(u.busy) return;
  u.busy = true;

  var bar = document.getElementById('up-bar'), go = document.getElementById('up-go');
  bar.hidden = false;
  go.textContent = 'Lädt hoch …';
  var p = 0;
  var t = setInterval(function(){
    p += 7;
    if(p >= 100){
      clearInterval(t); u.busy = false;
      VIDEOS.unshift({
        id:'neu-'+Date.now(), t:titel.trim(),
        k:(document.getElementById('up-kat')||{}).value || 'dribbling',
        lv:u.lv, d:'0:00', zg:u.vis, neu:true, views:0,
        gast:(u.vis==='pro' ? ((document.getElementById('up-gast')||{}).value || 'Gastspieler') : null),
        be:(document.getElementById('up-be')||{}).value || 'Noch keine Beschreibung.',
        st:['Schritte ergänzt Kader nach dem Upload.'],
        fe:'Wird nachgetragen.'
      });
      var war = u.vis;
      haptik('erfolg');
      state.up = {datei:null, lv:1, vis:'offen', busy:false};
      state.tab = 'technik'; state.kat = 'alle'; state.fltLv = 0; state.suche = '';
      while(stack.length) closeSheet();
      render();
      toast(war==='pro' ? 'Veröffentlicht als Profi-Einheit' :
            (war==='konto' ? 'Veröffentlicht, sichtbar mit Konto' : 'Veröffentlicht, sichtbar für alle'));
      return;
    }
    bar.firstElementChild.style.width = p+'%';
  }, 120);
}

/* Die Kopfzeile legt sich erst in den Schatten, wenn etwas darunter
   weggescrollt ist. Kleinigkeit, aber genau daran erkennt das Auge
   eine App und keine Webseite. */
(function(){
  var sc = document.getElementById('screens'), ab = document.querySelector('.appbar');
  if(!sc || !ab) return;
  sc.addEventListener('scroll', function(){
    ab.classList.toggle('scrolled', sc.scrollTop > 4);
    /* Ist die grosse Ueberschrift weggescrollt, uebernimmt die Kopfzeile. */
    ab.classList.toggle('tief', sc.scrollTop > 46);
  }, {passive:true});
})();

applyTheme();
render();
if(window.km1Start) window.km1Start.fertig('app');

/* Punkt 11: die Platzhalterkarten. Den Zeitpunkt gibt jetzt der
   Startbildschirm vor — kurz bevor er abblendet, stehen die echten
   Karten schon da. So gibt es einen Uebergang statt zweier
   Ladezustaende hintereinander. Der Zeitgeber faengt den Fall ab,
   dass es den Startbildschirm nicht gibt.

   In der fertigen App endet der Zustand, wenn die Videoliste vom
   Server da ist; heute liegt sie im Dokument. */
(function(){
  var fertig = function(){
    if(!state.laedt) return;
    state.laedt = false;
    letzterTab = null;      /* damit die Bloecke einmal aufblenden */
    render();
  };
  if(window.km1Start) window.km1Start.kurzVorSchluss(fertig);
  setTimeout(fertig, 2600);
})();
</script>
