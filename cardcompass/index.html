<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./cardcompass-logo.png" />
    <link rel="apple-touch-icon" href="./cardcompass-logo.png" />
    <meta name="theme-color" content="#8b00ff" />
    <title>CardCompass – Trading Cards, Displays & Zubehör</title>
    <meta name="description" content="CardCompass: Booster, Displays, Kollektionen und Zubehör für Pokémon, One Piece, Yu-Gi-Oh!, Magic und mehr – sicher bezahlen, schnell geliefert." />
    <meta property="og:title" content="CardCompass – Trading Cards, Displays & Zubehör" />
    <meta property="og:description" content="Booster, Displays, Kollektionen und Zubehör für Pokémon, One Piece, Yu-Gi-Oh!, Magic und mehr." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./cardcompass-logo.png" />
    <!--cc:robots-->
    <script>
      // Apply the saved colour theme before first paint (no light→dark flash).
      try { if (localStorage.getItem('cc_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
      // After a new deploy a cached page may point at app files that no longer
      // exist – reload once to fetch the current version instead of hanging.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || (t.tagName !== 'SCRIPT' && !(t.tagName === 'LINK' && t.rel === 'stylesheet'))) return;
        try { if (sessionStorage.getItem('cc_boot_reload')) return; sessionStorage.setItem('cc_boot_reload', '1'); } catch (_) { return; }
        location.reload();
      }, true);
      window.addEventListener('load', function () { setTimeout(function () { try { sessionStorage.removeItem('cc_boot_reload'); } catch (_) {} }, 5000); });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app has loaded (replaced by React on first render). -->
      <div class="boot" role="status" aria-label="CardCompass lädt">
        <img src="./cardcompass-logo.webp" alt="" width="72" height="72" />
        <span class="boot-bar"><span></span></span>
        <p class="boot-slow">Das dauert länger als üblich … <button type="button" onclick="location.reload()">Neu laden</button></p>
      </div>
    </div>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; background: #fff; font: 15px/1.4 system-ui, sans-serif; color: #2f3547; }
      :root[data-theme='dark'] .boot { background: #0b0716; color: #d9d0ee; }
      .boot img { width: 72px; height: 72px; border-radius: 20px; background: #fff; box-shadow: 0 16px 40px -14px rgba(139, 0, 255, .6); animation: bootPulse 1.6s ease-in-out infinite; }
      .boot-bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(139, 0, 255, .15); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #8b00ff; animation: bootBar 1.1s ease-in-out infinite; }
      .boot-slow { margin: 0; opacity: 0; animation: bootShow .3s 12s forwards; text-align: center; }
      .boot-slow button { margin-left: 6px; padding: 6px 12px; border: 0; border-radius: 10px; background: #8b00ff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      @keyframes bootPulse { 50% { transform: scale(.94); } }
      @keyframes bootBar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes bootShow { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot img, .boot-bar span { animation: none; } }
    </style>
    <noscript>CardCompass benötigt JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
